# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  # ----------------------------------------------------------------------------
  # Observability stack — the services live in docker/compose-dev.yaml, which
  # includes compose-sre.yaml. These are the shortcuts for wiring the
  # application to the stack: start it, check it, read back what it shipped.
  # ----------------------------------------------------------------------------

  metrics:up:
    desc: Start the observability stack (collector, VictoriaMetrics/Logs/Traces, Perses)
    cmds:
      - docker compose -f docker/compose.yaml up --detach --remove-orphans otel-collector victoria-metrics victoria-logs victoria-traces perses
      - task: metrics:health

  metrics:health:
    desc: Probe every stack endpoint from the host and fail when one does not come up
    # Perses answers on /api/v1/health, the rest on /health; each target carries
    # its path as PORT/path. Plain shell, not a Task `for`: a Task variable
    # holding a space would be quoted into one word. Each target is retried,
    # because `metrics:up` calls this while the containers are still starting.
    vars:
      TIMEOUT: '{{.TIMEOUT | default "60"}}'
    cmd: |
      for target in 33802/health 33801/health 33803/health 3380/api/v1/health; do
        url="http://localhost:${target%%/*}/${target#*/}"
        deadline=$((SECONDS + {{.TIMEOUT}}))
        until curl --silent --fail --max-time 5 "$url" >/dev/null 2>&1; do
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "down $url (no answer within {{.TIMEOUT}}s)"
            exit 1
          fi
          sleep 1
        done
        echo "up   $url"
      done

  metrics:endpoints:
    desc: Print the stack endpoints and the variables that reach them
    cmds:
      - echo "OTLP fan-out (Vector) http://localhost:4318 (the one address the app dials)"
      - echo "VictoriaLogs query http://localhost:33801/select/logsql/query"
      - echo "VictoriaMetrics    http://localhost:33802"
      - echo "VictoriaTraces     http://localhost:33803/select/jaeger"
      - echo "Perses UI          http://localhost:3380"
      - echo "Perses MCP         http://localhost:3880/mcp"
      - echo ""
      - echo "Set these in .env.local to ship from the application:"
      - echo "  LOG_TRANSPORT=console,otlp"
      - echo "  OTEL_ENDPOINT=http://localhost:4318"
      - echo "  OTEL_TRACING_ENABLE=true"
      - echo "  OTEL_METRICS_ENABLE=true"

  metrics:query:
    desc: Run a LogsQL query against the local log store (pass the query after --)
    vars:
      QUERY: '{{.CLI_ARGS | default "*"}}'
    cmd: |
      # Unquoted on purpose: Task already quotes a substituted variable, and
      # quoting again would lose the spaces a LogsQL query contains.
      curl -sS --get --data-urlencode query={{.QUERY}} --data-urlencode 'limit=20' \
      http://localhost:33801/select/logsql/query

  metrics:traces:
    desc: List the services VictoriaTraces has received spans for
    cmd: curl -sS 'http://localhost:33803/select/jaeger/api/services' | jq -r '.data[]'

  metrics:targets:
    desc: Show the scrape targets VictoriaMetrics is collecting
    cmd: curl -sS 'http://localhost:33802/api/v1/targets?state=active' | jq -r '.data.activeTargets[] | "\(.labels.job)\t\(.scrapeUrl)\t\(.health)"'

  metrics:smoke:
    desc: Ship one line through every configured transport and read it back
    cmd: go run -tags debug ./cmd logger:smoke --env-file=.env.local {{.CLI_ARGS}}

  metrics:smoke:otel:
    desc: Record one span and one measurement through the configured signals
    cmd: go run -tags debug ./cmd otel:smoke --env-file=.env.local {{.CLI_ARGS}}

  metrics:down:
    desc: Stop the observability stack
    cmd: docker compose -f docker/compose.yaml stop vector victoria-metrics victoria-logs victoria-traces perses
