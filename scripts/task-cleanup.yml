# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  cleanup:
    desc: Remove build artifacts and dependencies
    cmds:
      - task: cleanup:dist
      - task: cleanup:deps

  cleanup:dist:
    desc: Remove build artifacts
    cmd: pnpm dlx del-cli .{output,tanstack} build web/output codegen packages/e2e-tests/e2e-result storage

  cleanup:deps:
    desc: Remove dependencies
    cmd: pnpm dlx del-cli pnpm-lock.yaml pnpm-workspace.yaml node_modules packages/*/node_modules vendor

  format:
    desc: Format all files (Go + JS)
    cmds:
      - gofmt -w .
      - pnpm exec vp fmt --write .

  check:
    desc: Run all checks (go vet + migration files + JS formatting)
    cmds:
      - go vet ./...
      - go run -tags debug ./cmd migrate:validate
      - pnpm exec vp check

  lint:
    desc: Run all linters (Go + JS)
    cmds:
      - pnpm exec vp lint --fix .
      - golangci-lint run -c .golangci.yml ./...

  typecheck:
    desc: Run TypeScript type checking
    deps: [rpc:generate]
    cmd: pnpm exec tsc -b --noEmit
