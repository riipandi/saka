# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  cert:generate:
    desc: Generate local HTTPS certificates
    vars:
      CERT_DIR: storage/config
    cmds:
      - mkdir -p {{.CERT_DIR}}
      - |
        if command -v mkcert >/dev/null 2>&1; then
          mkcert -key-file {{.CERT_DIR}}/localhost_key.pem \
            -cert-file {{.CERT_DIR}}/localhost_crt.pem \
            localhost 127.0.0.1 ::1 host.docker.internal "*.localhost.test" localhost.emobix.co.uk
        else
          openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -nodes \
            -keyout {{.CERT_DIR}}/localhost_key.pem \
            -out {{.CERT_DIR}}/localhost_crt.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:host.docker.internal,DNS:*.localhost.test,DNS:localhost.emobix.co.uk,IP:127.0.0.1,IP:0:0:0:0:0:0:0:1"
        fi
      - openssl x509 -in {{.CERT_DIR}}/localhost_crt.pem -noout -subject -ext subjectAltName

  cert:trust:
    desc: Trust the local CA
    cmds:
      - |
        if ! command -v mkcert >/dev/null 2>&1; then
          echo "mkcert is not installed — add storage/config/localhost_crt.pem to your trust store manually"
          exit 0
        fi
        mkcert -install

  # The PKCS12 truststore the conformance suite's JVM imports.
  cert:conformance:
    desc: Build the conformance suite truststore
    cmds:
      - ./scripts/cert-conformance.sh

  rpc:generate:
    desc: Generate Go + TypeScript from the proto contracts
    sources:
      - api/connect/**/*.proto
      - buf.yaml
      - buf.gen.yaml
    generates:
      - codegen/proto/go/**/*.go
      - codegen/proto/ts/**/*.ts
    cmds:
      - go tool buf generate
      - gofmt -w codegen/proto/go
      - task: rpc:stamp

  rpc:lint:
    internal: true
    desc: Lint protobuf contracts
    cmd: go tool buf lint

  rpc:breaking:
    internal: true
    desc: Check contracts for breaking changes
    cmd: go tool buf breaking --against '.git#ref=HEAD~1,subdir=api/connect'

  rpc:stamp:
    internal: true
    desc: Refresh the contract stamp
    cmd: sh -c 'find api/connect buf.yaml buf.gen.yaml -type f | LC_ALL=C sort | xargs shasum -a 256 > .output/rpc-gen.stamp'

  rpc:stale:
    internal: true
    desc: Fail when codegen is stale
    cmds:
      - sh -c 'find api/connect buf.yaml buf.gen.yaml -type f | LC_ALL=C sort | xargs shasum -a 256 > /tmp/rpc-stamp.now'
      - sh -c 'test -f .output/rpc-gen.stamp || (echo "no contract stamp yet — run task rpc:generate" && exit 1)'
      - sh -c 'diff .output/rpc-gen.stamp /tmp/rpc-stamp.now || (echo "contracts changed — run task rpc:generate" && exit 1)'
