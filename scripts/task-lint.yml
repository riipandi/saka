# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  format:
    desc: Format all files (Go + JS)
    cmds:
      - gofmt -w .
      - pnpm exec oxfmt --write .

  check:
    desc: Run all checks (go vet + migration files + JS formatting)
    cmds:
      - go vet ./...
      - go run -tags debug ./cmd migrate:validate
      - pnpm exec oxfmt --check
      - pnpm exec oxlint

  lint:
    desc: Run all linters (Go + JS)
    cmds:
      - pnpm exec oxlint --fix .
      - golangci-lint run -c .golangci.yml ./...

  typecheck:
    desc: Run TypeScript type checking
    deps: [rpc:generate]
    cmd: pnpm exec tsc -b --noEmit
