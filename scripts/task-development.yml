# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  dev:
    desc: Dev loop on one origin (:3080) — Vite compiles + HMR behind the Go proxy, the binary rebuilt from build/debug on every Go change
    deps: [rpc:generate]
    cmd: pnpm exec vp dev {{.CLI_ARGS}}

  run:
    desc: Run the CLI directly (debug build)
    cmd: go run -tags debug ./cmd --env-file=.env.local {{.CLI_ARGS}}

  serve:
    desc: Run the Saka server (debug build)
    cmd: go run -tags debug ./cmd --env-file=.env.local serve {{.CLI_ARGS}}

  conformance:up:
    desc: Start the OIDF conformance suite stack (mongodb, server, its nginx on :8443) — container/compose-mock.yaml
    dir: container
    cmd: docker compose -f compose-mock.yaml up -d

  conformance:run:
    desc: Run one conformance plan against the local issuer — needs the suite stack up, a seeded database (migrate:seed), and the release binary serving the harness config
    dir: packages/e2e-tests
    cmd: node conformance/run.mjs {{.CLI_ARGS}}

  email:dev:
    desc: Run React Email dev UI (:3030)
    cmd: pnpm exec vp run email#dev

  email:build:
    desc: Compile email templates into the Go embed (one Vite pass, no binary)
    cmd: pnpm exec vp build packages/email

  deps:
    desc: Install Go toolchain binaries (golangci-lint, goose, etc)
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - go install github.com/goreleaser/goreleaser/v2@latest
      - go install github.com/anchore/grype/cmd/grype@latest
      - go install github.com/swaggo/swag/cmd/swag@latest
      - go get -tool github.com/bufbuild/buf/cmd/buf@latest
      - go get -tool google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go get -tool connectrpc.com/connect/cmd/protoc-gen-connect-go@latest

  update-deps:
    desc: Update dependencies
    deps: [rpc:generate]
    cmds:
      - pnpm exec npm-check-updates --configFileName .ncurc.json
      - go mod download && go mod tidy
