# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  cert:generate:
    desc: Generate local HTTPS certificates into storage/config
    vars:
      CERT_DIR: storage/config
    cmds:
      - mkdir -p {{.CERT_DIR}}
      - |
        if command -v mkcert >/dev/null 2>&1; then
          mkcert -key-file {{.CERT_DIR}}/localhost_key.pem \
            -cert-file {{.CERT_DIR}}/localhost_crt.pem \
            localhost 127.0.0.1 ::1 host.docker.internal "*.localhost.test"
        else
          openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -nodes \
            -keyout {{.CERT_DIR}}/localhost_key.pem \
            -out {{.CERT_DIR}}/localhost_crt.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:host.docker.internal,DNS:*.localhost.test,IP:127.0.0.1,IP:0:0:0:0:0:0:0:1"
        fi
      - openssl x509 -in {{.CERT_DIR}}/localhost_crt.pem -noout -subject -ext subjectAltName

  cert:trust:
    desc: Trust the local CA so browsers accept the generated certificates
    cmds:
      - |
        if ! command -v mkcert >/dev/null 2>&1; then
          echo "mkcert is not installed — add storage/config/localhost_crt.pem to your trust store manually"
          exit 0
        fi
        mkcert -install
