# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  db:migrate:
    desc: Run database migrations
    cmd: go run -tags debug ./cmd migrate:up --env-file=.env.local {{.CLI_ARGS}}

  db:rollback:
    desc: Roll back the most recent migration
    cmd: go run -tags debug ./cmd migrate:down --env-file=.env.local {{.CLI_ARGS}}

  db:status:
    desc: Show database migration status
    cmd: go run -tags debug ./cmd migrate:status --env-file=.env.local {{.CLI_ARGS}}

  db:version:
    desc: Print the current migration version
    cmd: go run -tags debug ./cmd migrate:version --env-file=.env.local {{.CLI_ARGS}}

  db:validate:
    desc: Check the embedded migration files
    cmd: go run -tags debug ./cmd migrate:validate

  db:reset:
    desc: Roll back every migration (add -- --up to re-apply)
    cmd: go run -tags debug ./cmd migrate:reset --env-file=.env.local {{.CLI_ARGS}}

  db:create:
    desc: Create a new migration file (task db:create -- add_widgets)
    cmd: go run -tags debug ./cmd migrate:create {{.CLI_ARGS}}

  db:seed:
    desc: Seed the database with default records (add -- --dry-run)
    cmd: go run -tags debug ./cmd migrate:seed --env-file=.env.local {{.CLI_ARGS}}

  db:initialize:
    desc: Bootstrap a fresh database — system seed, signing key pair, first administrator
    cmd: go run -tags debug ./cmd initialize --env-file=.env.local {{.CLI_ARGS}}

  db:export:
    desc: Export the database to a SQL file (add -- --compression=gzip)
    cmd: go run -tags debug ./cmd db:export --env-file=.env.local {{.CLI_ARGS}}

  db:import:
    desc: Import a backup file (task db:import -- storage/backup/file.sql.gz)
    cmd: go run -tags debug ./cmd db:import --env-file=.env.local {{.CLI_ARGS}}
