# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

name: saka

x-common: &common
  networks: ["intranet"]
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "localhost:host-gateway"
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  shm_size: 128m # set shared memory limit
  mem_limit: 256m # set memory limit
  cpus: 1.0 # set CPUs limit

include:
  - ./compose-dev.yaml
  - ./compose-mock.yaml

#####################################################################
# oidc-test-client drives Saka's own OIDC/OAuth surface in E2E:
# Saka answers on the host (dev :3080 or the disposable E2E port; the
# localhost extra_hosts mapping resolves it from inside the container).
# Before the run, mint a client through Saka's admin RPC with callback
# http://localhost:9010/auth/callback (verify the callback path against
# the image at first use) and pass the credentials:
#   SAKA_TEST_CLIENT_ID=... SAKA_TEST_CLIENT_SECRET=... \
#     docker compose -f container/compose-dev.yaml up -d oidc-test-client
# Take the container down with the E2E artifacts. ngauth-google above
# stays pointed at itself — it belongs to the future social sign-in work.
#####################################################################

