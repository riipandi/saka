log_format json_edge escape=json '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","protocol":"$server_protocol","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"user_agent":"$http_user_agent"}';
access_log /var/log/nginx/access.json json_edge;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, X-API-KEY, Connect-Protocol-Version, Connect-Timeout-Ms, Connect-Accept-Encoding, Connect-Content-Encoding, X-Grpc-Web, X-User-Agent" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;
proxy_redirect off;
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
send_timeout 300s;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

server {
    listen 9180;
    location / {
        proxy_pass http://silo:9100/devbucket/;
    }
    # Read by the nginx-exporter's scraper; the metric names
    # the nginx-proxy dashboard reads are the ones this stub
    # publishes.
    location /stub_status {
        stub_status;
    }
}

server {
    http2 on;
    listen 3443 ssl;
    listen 3443 quic reuseport;
    ssl_certificate /etc/nginx/certs/localhost_crt.pem;
    ssl_certificate_key /etc/nginx/certs/localhost_key.pem;
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Alt-Svc 'h3=":3443"; ma=86400';
    location / {
        proxy_pass http://host.docker.internal:3080;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }
}

# The TLS front the mock identity provider sits behind: the OAuth SSO
# feature holds every provider endpoint to https, so the browser's
# redirects and the server-side fetches cross one. The forwarded-proto
# and forwarded-port headers are what the mock derives its issuer URLs
# from — without them it answers http:// everywhere. Both ports serve
# the mkcert certificate the `task cert:generate` wrote — localhost by
# name — and both route into the one mock's issuer paths.

server {
    listen 3220 ssl;
    ssl_certificate /etc/nginx/certs/localhost_crt.pem;
    ssl_certificate_key /etc/nginx/certs/localhost_key.pem;
    location / {
        proxy_pass http://mock-oauth2:8080;
        proxy_set_header Host localhost:3220;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 3220;
    }
}
