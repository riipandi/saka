# The OTLP front door of the observability stack.
#
# The application dials the otlp receiver on :4318 (OTLP/HTTP only — its
# exporters speak http/protobuf, so there is no gRPC listener to configure).
# The postgresql and redis receivers scrape the dev databases' own metrics,
# which replaces the postgres-exporter and redis-exporter sidecars the
# VictoriaMetrics stack used. Everything is exported to OpenObserve over
# OTLP/HTTP with the Basic header its ingestion API expects.
#
# @ref https://openobserve.ai/docs/ingestion/logs/otlp/
# @ref https://openobserve.ai/blog/how-to-monitor-postgresql-performance/
# @ref https://openobserve.ai/blog/monitor-redis-metrics-otel/

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

  postgresql:
    endpoint: pgsql:5432
    username: postgres
    password: securedb
    databases: [postgres]
    collection_interval: 30s
    tls:
      insecure: true
    connection_pool:
      max_idle: 2
      max_open: 5
      max_idle_time: 10m
      max_lifetime: 0

  redis:
    endpoint: valkey:6379
    password: securedb
    collection_interval: 30s

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    send_batch_size: 10000
    send_batch_max_size: 11000
    timeout: 10s

exporters:
  otlphttp/openobserve:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:OPENOBSERVE_AUTH}"
      stream-name: default

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    metrics:
      receivers: [otlp, postgresql, redis]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
