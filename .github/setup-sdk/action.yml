# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# @reference: https://stackoverflow.com/questions/59813998/github-actions-splitting-workflow-file
# @reference: https://docs.github.com/en/actions/creating-actions/creating-a-composite-action

name: setup-sdk
description: Prepare development environment

inputs:
  nodeVersion:
    description: "Nodejs version"
    required: false
    default: "24"
  goVersion:
    description: "Golang version"
    required: false
    default: ">=1.27.0"

outputs:
  nodeModules:
    description: "Whether the node_modules cache was restored"
    value: ${{ steps.node-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Vite+ (vp)
      uses: voidzero-dev/setup-vp@v1.21.1
      with:
        node-version: ${{ inputs.nodeVersion }}
        cache-dependency-path: "pnpm-lock.yaml"
        cache: true
        run-install: false

    # Restoring node_modules directly skips the pnpm link step entirely;
    # the pnpm store cache above only accelerates a cold install.
    - name: Cache node_modules
      id: node-cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Setup Golang toolchain
      uses: actions/setup-go@v7
      with:
        token: ${{ github.token }}
        go-version: ${{ inputs.goVersion }}
        cache-dependency-path: "go.sum"
        cache: true
