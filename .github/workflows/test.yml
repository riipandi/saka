# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test

on:
  push:
    # branches: ["**"]
    branches: ["main"]
    paths-ignore:
      - ".vite-hooks/**"
      - ".github/workflows/release.yml"
      - ".goreleaser.yaml"
      - ".llms/**"
      - ".vscode/**"
      - ".zed/**"
      - "container/**"
      - "deploy/**"
      - "docs/**"
      - "packages/**"
      - "scripts/**"
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Platform to test
        required: false
        type: choice
        options:
          - all
          - linux
          - macos
        default: all

permissions: read-all

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
  CGO_ENABLED: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        # @ref: https://github.com/actions/runner-images
        # Both OSes run the full unit-test suite. Container-based integration
        # tests only run on Linux: GitHub-hosted macOS runners lack nested
        # virtualization, so a Linux VM for Docker would require QEMU
        # (runner-images #9460/#13505) — deliberately not used. On macOS,
        # testutils.SkipWithoutDocker skips the container tests instead of
        # failing them. To restore full macOS coverage, host the runner on
        # real hardware with Docker (labels: [self-hosted, macOS])
        # and drop this distinction — no QEMU needed there.
        # Empty on push/pull_request; on workflow_dispatch the `os` input
        # restricts the matrix to a single platform.
        os: ${{ fromJson((inputs.os || 'all') == 'linux' && '["ubuntu-24.04"]' || (inputs.os || 'all') == 'macos' && '["macos-15"]' || '["ubuntu-24.04", "macos-15"]') }}
        go-version: ["1.27.1"]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup SDK
        id: setup-sdk
        uses: ./.github/setup-sdk
        with:
          goVersion: ${{ matrix.go-version }}

      - name: Cache gotestsum binary
        id: gotestsum
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: gotestsum-${{ runner.os }}-v1.13.0

      - name: Install dependencies
        run: |
          # Always install: the node_modules cache holds only the root
          # node_modules, while a pnpm workspace links each importer's
          # dependencies into packages/*/node_modules — with the store cache
          # warm this is a link step, not a download.
          pnpm install --ignore-scripts --frozen-lockfile
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # Vite Task cache (@ref: https://viteplus.dev/guide/github-actions-cache).
      # Restored after install because package installation can recreate node_modules.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate ConnectRPC code
        run: |
          go mod download
          go tool buf generate
          gofmt -w codegen/proto/go

      - name: Tidy dependencies
        run: go mod tidy

      - name: Install gotestsum
        if: steps.gotestsum.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@v1.13.0

      # The Go compile steps below embed web/email (templates) and web/output
      # (the SPA bundle plus the derived assets.json) — both artifacts must
      # exist first. The webapp pass also compiles the debug and release
      # binaries with the plugin's own ldflags; there is no separate build
      # step at the end.
      - name: Build frontend artifacts
        run: |
          pnpm exec vp run email#build
          pnpm exec vp run webapp#build
        env:
          NODE_ENV: production

      - name: Setup golangci-lint toolchain
        uses: golangci/golangci-lint-action@v9
        with:
          github-token: ${{ github.token }}
          install-mode: binary
          version: v2.13

      - name: Check code quality
        run: |
          go vet ./...
          pnpm exec vp fmt --check
          pnpm exec vp lint .
          golangci-lint run -c .golangci.yml ./...
        env:
          NODE_ENV: production

      - name: Type check (TypeScript)
        run: vp run typecheck
        env:
          NODE_ENV: production

      - name: Run unit tests (frontend)
        run: pnpm exec vp test
        env:
          NODE_ENV: production

      - name: Run unit tests (backend)
        run: gotestsum --format testname ./...
        env:
          NODE_ENV: production

      - name: Run unit tests (backend, debug tags)
        run: gotestsum --format testname -- -tags debug ./cmd/...
        env:
          NODE_ENV: production

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
