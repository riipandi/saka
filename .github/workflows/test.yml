# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test

on:
  # push:
  #   branches: ["**"]
  #   tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Platform to test
        required: false
        type: choice
        options:
          - all
          - linux
          - macos
        default: all

permissions: read-all

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
  CGO_ENABLED: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        # @ref: https://github.com/actions/runner-images
        # Both OSes run the full unit-test suite. Container-based integration
        # tests only run on Linux: GitHub-hosted macOS runners lack nested
        # virtualization, so a Linux VM for Docker would require QEMU
        # (runner-images #9460/#13505) — deliberately not used. On macOS,
        # testutils.SkipWithoutDocker skips the container tests instead of
        # failing them. To restore full macOS coverage, host the runner on
        # real hardware with Docker (labels: [self-hosted, macOS])
        # and drop this distinction — no QEMU needed there.
        # Empty on push/pull_request; on workflow_dispatch the `os` input
        # restricts the matrix to a single platform.
        os: ${{ fromJson((inputs.os || 'all') == 'linux' && '["ubuntu-24.04"]' || (inputs.os || 'all') == 'macos' && '["macos-15"]' || '["ubuntu-24.04", "macos-15"]') }}
        go-version: ["1.27.1"]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup SDK
        id: setup-sdk
        uses: ./.github/setup-sdk
        with:
          goVersion: ${{ matrix.go-version }}

      - name: Cache gotestsum binary
        id: gotestsum
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: gotestsum-${{ runner.os }}-v1.13.0

      - name: Install dependencies
        run: |
          if [[ "${{ steps.setup-sdk.outputs.nodeModules }}" != "true" ]]; then
            pnpm install --ignore-scripts --frozen-lockfile
          fi
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # Vite Task cache (@ref: https://viteplus.dev/guide/github-actions-cache).
      # Restored after install because package installation can recreate
      # node_modules. The rolling primary key keeps entries immutable; the
      # restore prefix picks the newest cache for this OS/arch. Task inputs
      # (sources, lockfiles) stay out of the key — Vite Task fingerprints them.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate ConnectRPC code
        run: |
          go mod download
          go tool buf generate
          gofmt -w codegen/proto/go

      - name: Tidy dependencies
        run: go mod tidy

      - name: Install gotestsum
        if: steps.gotestsum.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Generate email template
        run: pnpm exec vp build
        env:
          SKIP_GO_BUILD: 1

      - name: Setup golangci-lint toolchain
        uses: golangci/golangci-lint-action@v9
        with:
          github-token: ${{ github.token }}
          install-mode: binary
          version: v2.13

      # Mirrors `task check lint` (Taskfile.yml).
      - name: Check code quality
        run: |
          go vet ./...
          pnpm exec oxfmt --check
          pnpm exec oxlint
          golangci-lint run -c .golangci.yml ./...
          pnpm exec oxlint --fix .
        env:
          NODE_ENV: production

      # Cached through `vp run` (vite.config.ts run.tasks).
      - name: Type check (TypeScript)
        run: vp run typecheck
        env:
          NODE_ENV: production

      # Mirrors `task test:ui` (Taskfile.yml).
      - name: Run unit tests (frontend)
        run: pnpm exec vitest run
        env:
          NODE_ENV: production

      # Mirrors `task test:go` (Taskfile.yml). Integration tests run the 
      # pg client tools inside the Postgres container, so no host 
      # PostgreSQL installation is needed.
      - name: Run unit tests (backend)
        run: gotestsum --format testname ./...
        env:
          NODE_ENV: production

      - name: Run unit tests (backend, debug tags)
        run: gotestsum --format testname -- -tags debug ./cmd/... ./database/...
        env:
          NODE_ENV: production

      # Mirrors `task build` (Taskfile.yml): the frontend bundle and the
      # derived assets.json land first, then both binaries embed them.
      - name: Build application binaries
        run: |
          pnpm exec vp build
          go build -tags "debug,noasm,nounsafe" -trimpath -o build/debug/saka ./cmd
          go build -tags "release,noasm,nounsafe" -trimpath -o build/release/saka ./cmd
        env:
          NODE_ENV: production

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
