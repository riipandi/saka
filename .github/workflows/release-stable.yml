# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# git tag -d v0.0.1
# git push origin --delete v0.0.1
#
# git tag v0.0.1 -m "version bump"
# git push origin v0.0.1

name: Release (stable)

on:
  push:
    # tags: ["v*.*.*"]
    tags: ["v20*-*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
  CGO_ENABLED: 0

jobs:
  create-release:
    name: Create Release
    # GoReleaser cross-compiles every target from one Linux host. The test
    # gate runs separately in the Test workflow (same tag ref); the release
    # is created as a draft, so publishing stays a manual, gated step.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup SDK
        id: setup-sdk
        uses: ./.github/setup-sdk
        with:
          goVersion: "1.27.1"

      - name: Install dependencies
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate ConnectRPC code
        run: |
          go tool buf generate
          gofmt -w codegen/proto/go

      - name: Generate email template
        run: pnpm exec vp build
        env:
          SKIP_GO_BUILD: 1

      # Code signing:
      # @ref: https://github.com/goreleaser/goreleaser-action?tab=readme-ov-file#signing
      # - name: Import GPG key
      #   id: import_gpg
      #   uses: crazy-max/ghaction-import-gpg@v6
      #   with:
      #     gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      #     passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          args: release --clean --skip=validate
          version: 2.14.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  publish-image:
    name: Publish image
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Derive build metadata
        id: build-meta
        run: |
          echo "hash=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ steps.build-meta.outputs.hash }}
            BUILD_DATE=${{ steps.build-meta.outputs.date }}
            BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          push: true
          sbom: false
