# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

x-common: &common
  networks: ["intranet"]
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "localhost:host-gateway"
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  shm_size: 256m # set shared memory limit
  mem_limit: 512m # set memory limit
  cpus: 1.0 # set CPUs limit
  healthcheck:
    start_period: 10s
    interval: 1m30s
    timeout: 10s
    retries: 3

#####################################################################
# The mock identity providers the OAuth SSO E2E runs against. One
# mock-oauth2-server carries both simulations as issuerIds — the first
# path segment of every URL — so the google simulation discovers at
#   https://localhost:3220/google/.well-known/openid-configuration
# and the github simulation at
#   https://localhost:3221/github/.well-known/openid-configuration
# (both connect to Tango as `custom` connections; the builtin adapters
# are pinned to the real hosts).
#
# The login page takes a username and derives the identity from it —
# no accounts to seed, no rate limits:
#   alice@…            a verified address with names      (JIT, linking,
#                       binding, MFA branches)
#   unverified-*       email_verified = false             (the email-code
#                       gate)
#   nonames-*          no given/family claims             (the continue
#                       step)
#
# The nginx front terminates TLS: the SSO feature holds every provider
# endpoint to https, so the browser's redirects and the server-side
# fetches cross one. The pair serves the mkcert certificate the
# `task cert:generate` wrote — localhost by name.
#####################################################################

services:
  mock-oauth2:
    <<: *common
    image: ghcr.io/navikt/mock-oauth2-server:${MOCK_OAUTH2_SERVER_VERSION:-6.0}
    platform: linux/amd64
    hostname: mock-oauth2
    expose: ["8080"]
    volumes:
      # The identity the login page's username answers with: one config
      # serves both issuers, and the subject prefixes pick the branch —
      # `unverified-*` carries an unverified address, `nonames-*` no
      # given/family claims, anything else the verified shape.
      - "./mock-oauth2/config.json:/app/config.json:ro"
    environment:
      JSON_CONFIG_PATH: /app/config.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/isalive || exit 1"]

  mock-tls:
    <<: *common
    image: docker.io/nginx:${MOCK_NGINX_VERSION:-1.31-alpine-slim}
    hostname: mock-tls
    ports: ["3220:3220", "3221:3221"]
    configs:
      - source: mock_proxy
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - "../storage/config:/etc/nginx/certs:ro"
    depends_on:
      mock-oauth2: { condition: service_healthy }

configs:
  mock_proxy:
    file: ./mock-proxy.conf

networks:
  intranet:
    driver: bridge
    enable_ipv6: false
