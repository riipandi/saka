# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

x-common: &common
  networks: ["intranet"]
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "localhost:host-gateway"
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  shm_size: 128m # set shared memory limit
  mem_limit: 256m # set memory limit
  cpus: 1.0 # set CPUs limit
  healthcheck:
    start_period: 10s
    interval: 1m30s
    timeout: 10s
    retries: 3

#####################################################################
# ngauth comes with pre-seeded data for immediate testing:
# 
# Test Users
#   Username: testuser / Password: password123
#   Username: alice / Password: alice123
#   Username: bob / Password: bob123
# 
# Test Clients
#   Client ID: test-client
#   Client Secret: test-secret
#   Redirect URI: http://localhost:3000/callback
#
# Two simulations run here:
#   - ngauth-google (:3220) uses the image's `google` preset — Google's
#     endpoint paths (/o/oauth2/v2/auth, /oauth2/v4/token, /oauth2/v3/
#     certs) and minimal claims. The preset answers no refresh token
#     (Google's own shape without access_type=offline), so a flow that
#     resolves against it carries an empty refresh half. The E2E
#     connects it to Tango as a `custom` connection and lets discovery
#     fill the endpoints — the builtin adapter is pinned to the real
#     hosts, which a mock cannot be.
#   - ngauth-github (:3221) uses the `custom` preset, because the image
#     ships no `github` preset: GitHub's OAuth2 user API cannot be
#     mimicked by ngauth, so the GitHub simulation connects to Tango as
#     a `custom` connection too.
#####################################################################

services:
  ngauth-google:
    <<: *common
    image: docker.io/ngauth/server:${NGAUTH_VERSION:-latest}
    platform: linux/amd64
    hostname: ngauth-google
    ports: ["3220:3000"]
    volumes:
      - "../.storage/ngauth_google_data:/app/data:rw"
      - "../storage/config/localhost_key.pem:/app/data/private-key.pem:ro"
    environment:
      NGAUTH_PRESET: google
      # https://localhost:3220/.well-known/openid-configuration
      NGAUTH_ISSUER: https://localhost:3220
      NGAUTH_DATA: /app/data
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "nc", "-vz", "127.0.0.1", "3000"]

  ngauth-github:
    <<: *common
    image: docker.io/ngauth/server:${NGAUTH_VERSION:-latest}
    platform: linux/amd64
    hostname: ngauth-github
    ports: ["3221:3000"]
    volumes:
      - "../.storage/ngauth_github_data:/app/data:rw"
      - "../storage/config/localhost_key.pem:/app/data/private-key.pem:ro"
    environment:
      NGAUTH_PRESET: custom
      NGAUTH_ACCESS_TOKEN_TTL: 7200
      NGAUTH_SUPPORT_PKCE: "true"
      NGAUTH_SCOPE_CLAIM_NAME: scope
      NGAUTH_SCOPE_FORMAT: string
      # https://localhost:3221/.well-known/openid-configuration
      NGAUTH_ISSUER: https://localhost:3221
      NGAUTH_DATA: /app/data
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "nc", "-vz", "127.0.0.1", "3000"]

  oidc-test-client:
    <<: *common
    image: ghcr.io/beryju/oidc-test-client:${OIDC_TEST_CLIENT_VERSION:-latest}
    hostname: oidc-test-client
    ports: ["9009:9009"]
    environment:
      OIDC_BIND: 0.0.0.0:9009
      OIDC_CLIENT_ID: test-client
      OIDC_CLIENT_SECRET: test-secret
      OIDC_ROOT_URL: http://localhost:9009
      OIDC_PROVIDER: https://localhost:3220
      OIDC_SCOPES: "openid,profile,email"
      OIDC_DO_REFRESH: false
      OIDC_DO_INTROSPECTION: false
      OIDC_DO_USER_INFO: false
      OIDC_TLS_VERIFY: true
    depends_on:
      ngauth-google: { condition: service_healthy }

volumes:
  ngauth_google_data:
  ngauth_github_data:

networks:
  intranet:
    driver: bridge
    enable_ipv6: false
