# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

x-common: &common
  networks: ["intranet"]
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "localhost:host-gateway"
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  cpus: 1.0 # set CPUs limit
  healthcheck:
    start_period: 10s
    interval: 1m30s
    timeout: 10s
    retries: 3

services:
  pgsql:
    <<: *common
    # image: dhi.io/postgres:${PGSQL_VERSION:-18} # production
    # image: dhi.io/postgres:${PGSQL_VERSION:-18-debian13-dev}
    image: docker.io/postgres:${PGSQL_VERSION:-18-alpine}
    hostname: postgres
    ports: ["5432:5432"]
    volumes: ["../.storage/pgsql_data:/var/lib/postgresql/18/docker:rw"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securedb
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_DATABASES: testdb,pocketid
    configs: [{ source: pgsql_multidb, target: /docker-entrypoint-initdb.d/multidb.sh }]
    shm_size: 256m # set shared memory limit
    mem_limit: 512m # set memory limit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  valkey:
    <<: *common
    image: docker.io/valkey/valkey:${VALKEY_VERSION:-9.2-alpine}
    hostname: valkey
    ports: ["6379:6379"]
    volumes: ["../.storage/valkey_data:/data:rw"]
    environment:
      ALLOW_EMPTY_PASSWORD: "no" # recommended only for development
      VALKEY_DISABLE_COMMANDS: FLUSHDB,FLUSHALL
    command: "--appendonly yes --appendfsync everysec --requirepass securedb"
    shm_size: 32m # set shared memory limit
    mem_limit: 64m # set memory limit
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a securedb ping | grep PONG"]
    ulimits:
      memlock: -1
      nofile:
        soft: 262144
        hard: 262144

  silo:
    <<: *common
    image: docker.io/pgsty/silo:${SILO_VERSION:-latest}
    hostname: silo
    ports: ["9100:9100", "9101:9101"]
    environment:
      MINIO_BROWSER_LOGIN_ANIMATION: off
      MINIO_DOMAIN: ${MINIO_DOMAIN:-localhost}
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-s3admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:-s3passw0rd}
      MC_HOST_local: http://${MINIO_ROOT_USER:-s3admin}:${MINIO_ROOT_PASSWORD:-s3passw0rd}@localhost:9100
    volumes: ["../.storage/silo_data:/data:rw"]
    command: server /data --address "0.0.0.0:9100" --console-address "0.0.0.0:9101"
    post_start:
      # docker-compose exec silo /usr/bin/mc alias ls
      - command: sh -c "/usr/bin/mc mb local/devbucket --ignore-existing"
      - command: sh -c "/usr/bin/mc mb local/otelbucket --ignore-existing"
      - command: sh -c "/usr/bin/mc mb local/testbucket --ignore-existing"
      - command: sh -c "/usr/bin/mc mb local/dbarchive --ignore-existing"
      - command: sh -c "/usr/bin/mc anonymous set download local/devbucket"
      - command: sh -c "/usr/bin/mc anonymous set download local/otelbucket"
      - command: sh -c "/usr/bin/mc anonymous set download local/testbucket"
    shm_size: 256m # set shared memory limit
    mem_limit: 512m # set memory limit
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready", "--address", "127.0.0.1:9100"]

  mailpit:
    <<: *common
    image: docker.io/axllent/mailpit:${MAILPIT_VERSION:-latest}
    hostname: mailpit
    volumes: ["../.storage/mailpit_data:/data:rw"]
    ports: ["1025:1025", "8025:8025"]
    environment:
      TZ: Asia/Jakarta
      MP_TAGS_USERNAME: true
      MP_DISABLE_VERSION_CHECK: true
      MP_ALLOW_UNTRUSTED_TLS: true
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_SMTP_AUTH_ALLOW_INSECURE: true
      MP_SMTP_AUTH: "maileruser1:mailerpass1 maileruser2:mailerpass2"
    shm_size: 32m # set shared memory limit
    mem_limit: 64m # set memory limit
    healthcheck:
      test: ["CMD-SHELL", "nc -vz 127.0.0.1 8025 || exit 1"]

  nginx:
    <<: *common
    # image: docker.io/nginx:${NGINX_VERSION:-1.31-alpine-slim}
    image: docker.io/nginx:${NGINX_VERSION:-1.31-alpine-otel}
    hostname: nginx
    ports: ["9180:9180", "3443:3443"]
    volumes: ["../storage/config:/etc/nginx/certs:ro", "../.storage/nginx_logs:/var/log/nginx:rw"]
    configs: [{ source: nginx_config, target: /etc/nginx/templates/default.conf.template }]
    shm_size: 32m # set shared memory limit
    mem_limit: 64m # set memory limit
    healthcheck:
      test: ["CMD", "nc", "-vz", "127.0.0.1", "9180"]
    depends_on:
      silo: { condition: service_started }

configs:
  # https://uptrace.dev/guides/opentelemetry-nginx
  nginx_config:
    content: |
      # Access logs ship as one JSON object per line: Vector reads this file and
      # forwards it to the log store, where the edge dashboards split response
      # status codes stub_status cannot provide.
      log_format json_edge escape=json '{"timestamp":"$$time_iso8601","remote_addr":"$$remote_addr","method":"$$request_method","uri":"$$uri","protocol":"$$server_protocol","status":$$status,"bytes":$$body_bytes_sent,"request_time":$$request_time,"user_agent":"$$http_user_agent"}';
      access_log /var/log/nginx/access.json json_edge;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, X-API-KEY, Connect-Protocol-Version, Connect-Timeout-Ms, Connect-Accept-Encoding, Connect-Content-Encoding, X-Grpc-Web, X-User-Agent" always;
      add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_redirect off;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      send_timeout 300s;
      proxy_set_header Host $$host;
      proxy_set_header X-Real-IP $$remote_addr;
      proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      server {
        listen 9180;
        server_name localhost;
        location / {
          proxy_pass http://silo:9100/devbucket/;
        }
        # Read by the nginx-exporter's scraper; the metric names the nginx-proxy
        # dashboard reads are the ones this stub publishes.
        location /stub_status {
          stub_status;
        }
      }
      server {
        http2 on;
        listen 3443 ssl;
        listen 3443 quic reuseport;
        server_name localhost;
        ssl_certificate /etc/nginx/certs/localhost_crt.pem;
        ssl_certificate_key /etc/nginx/certs/localhost_key.pem;
        ssl_protocols TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Alt-Svc 'h3=":3443"; ma=86400';
        location / {
          proxy_pass http://host.docker.internal:3080;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Ssl on;
        }
      }

  pgsql_multidb:
    content: |
      #!/bin/bash
      set -euo pipefail
      if [ -z "$${POSTGRES_DATABASES:-}" ]; then
        echo "No databases requested for creation."
        exit 0
      fi
      echo "Multiple database creation requested: $$POSTGRES_DATABASES"
      IFS=',' read -ra databases <<<"$$POSTGRES_DATABASES"
      for db in "$${databases[@]}"; do
        echo "  Creating database '$$db' with owner '$$POSTGRES_USER'"
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
          -c "CREATE DATABASE \"$$db\" WITH OWNER = \"$$POSTGRES_USER\" ENCODING = 'UTF8' LC_COLLATE = 'en_US.UTF-8' LC_CTYPE = 'en_US.UTF-8' TEMPLATE = template0;"
      done
      echo "Multiple databases and schemas created successfully."

volumes:
  pgsql_data:
  valkey_data:
  mailpit_data:
  silo_data:

networks:
  intranet:
    driver: bridge
    enable_ipv6: false
