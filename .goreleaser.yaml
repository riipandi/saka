# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: saka
report_sizes: true
dist: ./release

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

env:
  - CGO_ENABLED=0
  - NODE_ENV=production

before:
  hooks:
    - go mod download
    - go mod tidy
    - pnpm install --ignore-scripts --frozen-lockfile
    - go tool buf generate
    - gofmt -w codegen/proto/go
    # The binaries goreleaser cross-compiles embed web/email (the templates)
    # and web/output (the SPA bundle plus the derived assets.json) — both
    # artifacts must exist first. The webapp pass runs the go plugin, whose
    # closeBundle derives assets.json; SKIP_GO_BUILD would skip exactly that.
    - pnpm exec vp run email#build
    - pnpm exec vp run webapp#build

builds:
  - id: build_noncgo
    main: ./cmd
    binary: "{{.Os}}_{{.Arch}}/{{.ProjectName}}"
    no_main_check: true
    no_unique_dist_dir: true
    goos: ["darwin", "linux", "windows"]
    goarch: ["amd64", "arm64"]
    buildmode: pie
    # Same tags the webapp plugin's release target builds with, so both build
    # paths produce the same binary.
    tags: ["release", "noasm", "nounsafe"]
    flags: ["-trimpath", "-buildvcs=false"]
    ldflags:
      - -w -s -extldflags '-static'
      - -X 'github.com/riipandi/saka/internal/config.AppVersion={{.Tag}}'
      - -X 'github.com/riipandi/saka/internal/config.BuildHash={{.ShortCommit}}'
      - -X 'github.com/riipandi/saka/internal/config.BuildDate={{.Date}}'

archives:
  - formats: [tar.gz]
    ids: [build_noncgo]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - docs/changelog.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "v{{ incpatch .Version }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^examples:"
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
  mode: prepend
  draft: true

