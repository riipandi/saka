# yaml-language-server: $schema=https://www.schemastore.org/pnpm-workspace.json

packages:
  - packages/*

allowBuilds:
  esbuild: true

verifyDepsBeforeRun: false

minimumReleaseAge: 0

catalogMode: prefer

catalog:
  '@types/node': ^26
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
