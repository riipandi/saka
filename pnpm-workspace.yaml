# yaml-language-server: $schema=https://www.schemastore.org/pnpm-workspace.json

packages:
  - packages/*

allowBuilds:
  esbuild: true

verifyDepsBeforeRun: false

minimumReleaseAge: 0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

catalogMode: prefer

catalog:
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/core': ^2.12.0
  '@opentelemetry/exporter-trace-otlp-http': ^0.223.0
  '@opentelemetry/resources': ^2.12.0
  '@opentelemetry/sdk-trace-web': ^2.12.0
  '@opentelemetry/semantic-conventions': ^1.43.0
  "@types/node": ^26.6.4
  "@vitejs/plugin-react": ^6.1.1
  "oxc-transform-react": ^0.145.0
  typescript: ^7.0.2
  uqr: ^0.1.3
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
