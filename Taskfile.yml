# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

vars:
  APP_NAME:
    sh: jq -r .name package.json 2>/dev/null || echo tango
  APP_VERSION:
    sh: jq -r .version package.json 2>/dev/null || echo 0.0.0
  IMAGE:
    sh: jq -r .config.image package.json 2>/dev/null || echo ghcr.io/riipandi/tango

# Every group lives in scripts/task-. Each include is flattened, so a task keeps
# the name it had when this file held it. That also keeps one flat namespace,
# so a task in one file can depend on a task in another by its plain name.
includes:
  dev:
    taskfile: ./scripts/task-development.yml
    flatten: true
  build:
    taskfile: ./scripts/task-build.yml
    flatten: true
  command:
    taskfile: ./scripts/task-command.yml
    flatten: true
  database:
    taskfile: ./scripts/task-database.yml
    flatten: true
  cert:
    taskfile: ./scripts/task-generate.yml
    flatten: true
  test:
    taskfile: ./scripts/task-test.yml
    flatten: true
  cleanup:
    taskfile: ./scripts/task-cleanup.yml
    flatten: true
  docker:
    taskfile: ./scripts/task-container.yml
    flatten: true
  metrics:
    taskfile: ./scripts/task-metrics.yml
    flatten: true

tasks:
  default:
    desc: List all available tasks
    cmd: task --list

  # ----------------------------------------------------------------------------
  # Docker compose
  # ----------------------------------------------------------------------------
  compose:up:
    desc: Start docker compose services
    cmd: docker compose -f container/compose.yaml up --detach --remove-orphans

  compose:down:
    desc: Stop docker compose services
    cmd: docker compose -f container/compose.yaml down --remove-orphans

  compose:restart:
    desc: Restart docker compose services
    cmds:
      - task: compose:down
      - task: compose:up

  compose:cleanup:
    desc: Stop services and remove volumes
    cmds:
      - docker-compose -f container/compose.yaml down --remove-orphans --volumes
      - pnpm dlx del-cli .storage/*_data .storage/nginx_logs

  compose:reset:
    desc: Reset docker compose services
    deps: [compose:cleanup]
    cmds:
      - task: compose:up
