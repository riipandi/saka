// The identity contract: the procedures that create and manage accounts.
//
// Sign-up creates an account from a signup token an operator issued. The
// account carries its primary credential from the first call — the password
// the caller chose — so it can sign in immediately; email verification is a
// later procedure and the account is created unverified.
//
// The failure codes follow docs/api-response.md: a refused signup token is
// `permission_denied`, an account that already exists is `already_exists`,
// and a malformed field is `invalid_argument` with the typed violations the
// protovalidate constraints produce.
syntax = "proto3";

package tango.identity.v1;

import "buf/validate/validate.proto";
import "common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/riipandi/tango/codegen/proto/go/tango/identity/v1;identityv1";

// SignupService creates accounts and administers the tokens sign-up requires.
service SignupService {
  // Signup creates an account. In the invite mode a valid signup token is
  // required; in the open mode the account is created without one, filtered
  // by the allowlist when that is on. Whether the account must verify its
  // email before signing in is a setting, so the answer's contract is
  // mode-independent.
  //
  // The invite token is a raw value an operator issued once and is stored
  // server-side only as a hash, so a database leak cannot replay it. A token
  // that is unknown, expired, or spent answers the same failure, so the
  // endpoint does not disclose which half was wrong. The username is
  // case-insensitive and the email is matched exactly, the way their unique
  // indexes are.
  rpc Signup(SignupRequest) returns (SignupResponse);

  // CreateSignupToken issues the signup token an account is created under.
  // It is an administrative procedure: the caller must carry a Bearer token
  // whose claims name an administrator, and a leaked machine credential is
  // no substitute, so a leaked key cannot mint account invitations.
  //
  // The raw token is generated here and returned once; only its hash is
  // stored, so no later procedure can read it back.
  rpc CreateSignupToken(CreateSignupTokenRequest) returns (CreateSignupTokenResponse);

  // ListSignupTokens answers the issued tokens with their usage counters.
  // The raw values are absent on purpose: they were shown once, at creation,
  // and only their hashes live in the database.
  rpc ListSignupTokens(ListSignupTokensRequest) returns (ListSignupTokensResponse);

  // DeleteSignupToken revokes an issued token. A spent or expired token needs
  // no deletion — the consumption rules refuse it — so this exists for an
  // invitation withdrawn before its window closes.
  rpc DeleteSignupToken(DeleteSignupTokenRequest) returns (DeleteSignupTokenResponse);
}

// UserService administers the accounts. Every procedure is administrative:
// the caller must carry a Bearer token whose claims name an administrator,
// the same rule the signup-token procedures apply — a leaked machine
// credential is no substitute, and a leaked key cannot rewrite accounts.
//
// An account's creation through sign-up is the SignupService's procedure;
// CreateUser is the administrator's own door, for an account that exists
// without an invitation. Updating is a full replace, the way the upstream
// endpoint it ports is: every field is specified, an absent optional field
// clears its column, and the ban fields operate as a unit.
service UserService {
  // ListUsers answers one page of the accounts, newest first, optionally
  // filtered by a search term matched against the username, the email, and
  // the display name — the columns the trigram indexes exist for.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // GetUser answers one account by its identifier.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // CreateUser creates an account directly, without a signup token. The
  // password is optional: an account created without one carries no
  // credential until a later procedure sets it.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // UpdateUser replaces an account's fields. The ban fields are one unit:
  // an expiry present applies the ban (the start instant is recorded
  // automatically), an absent expiry lifts it.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // DeleteUser removes an account. The database trigger archives the row, so
  // the removal is soft by construction, not by a flag the service writes.
  // An administrator cannot delete the account they are signed in with.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // ResetProfilePicture removes an account's profile picture. The account
  // falls back to the bundled default picture the read answers with. The
  // caller may be the account's owner or an administrator.
  rpc ResetProfilePicture(ResetProfilePictureRequest) returns (ResetProfilePictureResponse);

  // GetCurrentUser answers the account the caller is. The target is the
  // token's subject, never something the request names — this is the `/me`
  // door upstream answers beside the identifier-addressed `GetUser`.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);

  // UpdateCurrentUser replaces the signed-in account's own profile fields:
  // the names the account displays, its locale, and — where the change
  // toggle admits it — the username. The credential, the address, and the
  // role are not the caller's to rewrite here — the administrative surface
  // owns them.
  rpc UpdateCurrentUser(UpdateCurrentUserRequest) returns (UpdateCurrentUserResponse);

  // DeleteMyAccount removes the signed-in account itself. The global
  // self-delete setting arms the door and the account's override column
  // answers for it; a caller the gate refuses answers the not-found code,
  // the same shape an unknown account earns, so the surface says nothing
  // about what the setting holds. The removal is the administrator delete's
  // own: the row is archived by the database trigger, the live sessions
  // die with their foreign keys, and the record names the account.
  rpc DeleteMyAccount(DeleteMyAccountRequest) returns (DeleteMyAccountResponse);

  // AddPassword sets the signed-in account's first password credential —
  // the self-service an account created without one holds. The proof is
  // the step-up token the guard consumes from the X-Tango-Reauthentication
  // header; an account that already holds a password is refused, because
  // changing one is a different procedure with its own proof. The password
  // must meet the account's policy; the strength floor is the frontend's
  // to show, the backend judges the length and the character rules.
  rpc AddPassword(AddPasswordRequest) returns (AddPasswordResponse);

  // RemovePassword deletes the signed-in account's password credential —
  // the self-service counterpart of AddPassword, for an account moving to
  // passkey-only sign-in. The proof is the step-up token the guard consumes
  // from the X-Tango-Reauthentication header, the same shape the addition
  // demands. The removal is refused while the account keeps no other live
  // credential (passkey or binding): an account that cannot sign in again is
  // a state the self-service never writes. Live sessions ride the queue's
  // password-changed notices, and the account's address learns of the
  // removal in a notification.
  rpc RemovePassword(RemovePasswordRequest) returns (RemovePasswordResponse);

  // BanUser applies a ban to the named account: the start instant is now,
  // the reason is required, and the expiry is optional — absent, the ban
  // never lifts by itself. Every live session the account holds is ended in
  // the same transaction (the statelessness the protocol settles means an
  // already-issued access token keeps working until its own expiry, but the
  // refresh token dies here), and a notification is queued to the account's
  // address. An unknown or malformed identifier answers the not-found code;
  // an already-banned account is the same success, with the reason and
  // expiry replaced — the write is the caller's intent, not a comparison.
  rpc BanUser(BanUserRequest) returns (BanUserResponse);

  // UnbanUser lifts the named account's ban as a unit — start instant,
  // expiry, and reason together. An account that is not banned is the same
  // success: the state the caller asked for is the state the row is in.
  // A notification is queued to the account's address.
  rpc UnbanUser(UnbanUserRequest) returns (UnbanUserResponse);

  // UnlockUser lifts the named account's open lockout — the automated
  // restriction the failed-attempt policy writes when a sign-in run trips
  // `lockout.max_attempts`. The admin lift is the same unit the expiry is:
  // the lockout row is lifted, and the account's failed-attempt streak
  // starts fresh, because the lockout answered for the streak. An account
  // with no open lockout is the same success — the state the caller asked
  // for is the state the account is in. A ban is not a lockout and the
  // procedure does not touch one; UnbanUser owns that.
  rpc UnlockUser(UnlockUserRequest) returns (UnlockUserResponse);
}

// UserGroupService administers the groups accounts belong to. A group is an
// organizing unit: it carries no permission of its own, but the members it
// gathers are addressed together — a later feature may hang claims on a
// group or gate a client on it, and every member inherits the outcome. The
// surface is administrative end to end, and the membership update is a
// replace, the way the upstream endpoint it ports is: the request names the
// whole member set, not a delta.
service UserGroupService {
  // ListUserGroups answers one page of the groups, optionally filtered by a
  // search term matched against the name and the display name, and sorted by
  // one column. The default order is the display name, ascending.
  rpc ListUserGroups(ListUserGroupsRequest) returns (ListUserGroupsResponse);

  // GetUserGroup answers one group with its members.
  rpc GetUserGroup(GetUserGroupRequest) returns (GetUserGroupResponse);

  // CreateUserGroup creates a group. The name is unique — the unique index
  // is the storage of that rule, and a duplicate answers `already_exists`.
  rpc CreateUserGroup(CreateUserGroupRequest) returns (CreateUserGroupResponse);

  // UpdateUserGroup replaces a group's two fields. Both are required, the
  // way the upstream endpoint it ports is.
  rpc UpdateUserGroup(UpdateUserGroupRequest) returns (UpdateUserGroupResponse);

  // DeleteUserGroup removes a group. Membership rows die with it by the
  // foreign keys' cascade, and the accounts themselves are untouched.
  rpc DeleteUserGroup(DeleteUserGroupRequest) returns (DeleteUserGroupResponse);

  // SetUserGroupMembers replaces the group's member set with the accounts
  // the request names. An empty list empties the group — a group may be
  // emptied, only not made wrong by a member that does not exist.
  rpc SetUserGroupMembers(SetUserGroupMembersRequest) returns (SetUserGroupMembersResponse);

  // GetUserGroups answers the groups one account belongs to, ordered by the
  // group's display name. The target is the account the request names; the
  // administrative procedures address accounts by identifier, which is the
  // shape the upstream port carries.
  rpc GetUserGroups(GetUserGroupsRequest) returns (GetUserGroupsResponse);

  // UpdateUserGroups replaces the set of groups one account belongs to.
  // The replacement, like its per-group sibling, is whole: the request
  // names every group the account belongs to after the call, and an empty
  // list removes the account from all of them. Every named group must
  // exist — a membership is not created into nothing.
  rpc UpdateUserGroups(UpdateUserGroupsRequest) returns (UpdateUserGroupsResponse);

  // SetAllowedOidcClients replaces the set of OIDC clients the group's
  // allowlist names — the group-side view of the client restriction, the
  // mirror of the client surface's UpdateAllowedUserGroups. The replace is
  // whole, an empty list empties the roll, and one identifier that names
  // no client refuses the replacement.
  rpc SetAllowedOidcClients(SetGroupAllowedOidcClientsRequest) returns (SetGroupAllowedOidcClientsResponse);
}

// EmailVerificationService verifies an account's address. The verification
// email is the only mail the flow sends, and the token it carries is the
// flow's whole credential: it is generated here, shown once in the message,
// and stored only as a hash, so a database leak cannot verify an account.
//
// SendEmail is the signed-in user's own door — it mails the address on
// record, never one the request names. VerifyEmail is answered without a
// caller: the token identifies the account, and the frontend the message
// links to forwards the value, so the flow works in a browser that holds no
// session.
service EmailVerificationService {
  // SendEmail mails the verification link to the signed-in user's address.
  // An already-verified account is refused — the caller learns the state
  // rather than receiving a pointless message — and an unconfigured mailer
  // refuses the procedure rather than enqueuing a task that cannot succeed.
  // The email itself is sent by the durable queue: the request writes the
  // token row and enqueues, and the queue's retries own the SMTP attempt.
  rpc SendEmail(SendVerificationEmailRequest) returns (SendVerificationEmailResponse);

  // VerifyEmail marks the account the token names as verified. An unknown,
  // expired, and spent token answer the same failure, so the endpoint does
  // not disclose which half was wrong. Verification consumes the token: the
  // row is deleted, so the link works once.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);

  // RequestEmailChange writes the pending change for the signed-in account
  // and mails its token to the address the change moves to. The address the
  // request names must be free: another account's address is refused here,
  // where the caller can pick a different one, rather than at the
  // confirmation, where the link would already be in flight. The message to
  // the old address is the account holder's defense against a change
  // someone else asked for; the token message is the flow itself.
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);

  // ConfirmEmailChange consumes the pending token and moves the account to
  // the address the token binds. An unknown, expired, and spent token
  // answer the same failure, and the row is deleted, so the link works
  // once. The confirmation is answered without a caller: the token
  // identifies the account, and the frontend the message links to forwards
  // the value, so the flow works in a browser that holds no session.
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse);
}

// SendVerificationEmailRequest is empty: the caller is the account the
// Bearer claims name, and the address is the one on record.
message SendVerificationEmailRequest {}

// SendVerificationEmailResponse is empty: acceptance says the token was
// issued and the task enqueued, not that a message was delivered.
message SendVerificationEmailResponse {
  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 1;

  // message is the human-readable sentence describing what the call did.
  string message = 2;
}

// VerifyEmailRequest carries the token the message linked to.
message VerifyEmailRequest {
  // token is the raw verification token, in clear text. It travels only
  // over TLS and is never logged.
  string token = 1 [(buf.validate.field).string.min_len = 1];
}

// VerifyEmailResponse is empty: the protocol carries the success.
message VerifyEmailResponse {
  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 1;

  // message is the human-readable sentence describing what the call did.
  string message = 2;
}

// RequestEmailChangeRequest names the address the account moves to.
message RequestEmailChangeRequest {
  // new_email is the pending address. It is refused here when another
  // account is already on record with it, and the token the procedure
  // mails binds it: the confirmation moves the account to this address,
  // never to one a replayed link could pick.
  string new_email = 1 [(buf.validate.field).string.email = true];
}

// RequestEmailChangeResponse is empty: acceptance says the token was issued
// and the tasks enqueued, not that a message was delivered.
message RequestEmailChangeResponse {
  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 1;

  // message is the human-readable sentence describing what the call did.
  string message = 2;
}

// ConfirmEmailChangeRequest carries the token the message linked to.
message ConfirmEmailChangeRequest {
  // token is the raw change token, in clear text. It travels only over TLS
  // and is never logged.
  string token = 1 [(buf.validate.field).string.min_len = 1];
}

// ConfirmEmailChangeResponse is empty: the protocol carries the success.
message ConfirmEmailChangeResponse {
  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 1;

  // message is the human-readable sentence describing what the call did.
  string message = 2;
}

// SignupRequest carries the account fields and, for the invite mode, the
// signup token. Which fields the request must carry is the settings' call —
// the access mode decides the token, the identity toggles decide the
// username — so the transport enforces the shapes and the service owns the
// conditionals.
message SignupRequest {
  // username is the account's handle: 3-32 characters of ASCII letters,
  // digits, and underscores, matched case-insensitively. Optional by the
  // identity toggles; presence and the pattern are the service's check.
  string username = 1;

  // email is the account's address, matched exactly.
  string email = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"];

  // password is the account's primary credential, in clear text. The field
  // travels only over TLS and is never logged. The transport's floor keeps a
  // degenerate answer cheap; the policy rule itself is the service's.
  string password = 3 [(buf.validate.field).string.min_len = 8];

  // token is the raw signup token the account is created under. Required
  // only in the invite mode; the access mode is a setting the service reads,
  // so the field carries no constraint here.
  string token = 4;

  // first_name is the given name the account displays.
  string first_name = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];

  // last_name is the family name the account displays.
  string last_name = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
}

// SignupResponse is the account the token created.
message SignupResponse {
  // user is the created account's view.
  User user = 1;

  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 2;

  // message is the human-readable sentence describing what the call did.
  string message = 3;
}

// User is the account view the identity procedures answer with. It carries
// the fields a client renders or an operator manages, not the row: no
// password hash, no metadata blob, no profile-picture path. The nullable
// columns are optional on the wire, so an account without a name part or a
// ban reads as absent rather than as an empty string.
message User {
  // id is the account's identifier in its wire form, a TypeID (`user_…`)
  // encoded from the row's UUID — the UUID never leaves the server.
  string id = 1;

  // username is the account's handle, case preserved as stored.
  string username = 2;

  // email is the account's address.
  string email = 3;

  // display_name is the name shown in the UI.
  string display_name = 4;

  // first_name is the optional given name.
  optional string first_name = 5;

  // last_name is the optional family name.
  optional string last_name = 6;

  // disabled says whether sign-ins are refused.
  bool disabled = 9;

  // email_verified says whether the address was verified. Verification
  // itself is a later procedure; the flag reflects the column.
  bool email_verified = 10;

  // created_at is the creation instant, RFC 3339.
  string created_at = 11;

  // banned_at is when the ban started, RFC 3339, absent when unbanned.
  optional string banned_at = 12;

  // ban_expires is when the ban lifts, RFC 3339, absent when unbanned or
  // permanent.
  optional string ban_expires = 13;

  // ban_reason is the note the banning administrator wrote.
  optional string ban_reason = 14;

  // metadata is the account's preference document — the locale and the
  // timezone an account sets about itself, read as one typed block. The
  // requests keep their flat fields; this is the stored shape's view.
  UserMetadata metadata = 15;

  // user_groups are the groups the account belongs to, ordered by the
  // group's display name — the same view ListUserGroups answers with, so
  // a client rendering an account never needs a second roundtrip to name
  // its memberships. The group names are what a deployment's clients
  // match a group-based claim against.
  repeated UserGroup user_groups = 16;
}

// UserMetadata is the account's preference document, the typed view of the
// JSONB `users.metadata` column. The document is closed: these keys are the
// whole contract, and a key a client invents is not carried. Absent fields
// answer the defaults — an absent timezone is UTC, an absent locale is
// unset — and the server never localizes: every instant it answers is UTC,
// the timezone is the presentation hint alone.
message UserMetadata {
  // locale is the optional preferred locale tag.
  optional string locale = 1;

  // timezone is the IANA zone the client formats UTC timestamps against;
  // "UTC" is the default.
  string timezone = 2;
}

// SignupToken is the issued token's view. It carries the counters an operator
// manages, never the raw value: a token is shown once, in the creation
// response, and only its hash is stored.
//
// SignupToken is one issued token as the list answers it.
message SignupToken {
  // id is the token row's identifier, a UUID string.
  string id = 1;

  // usage_limit is how many sign-ups the token admits.
  int32 usage_limit = 2;

  // usage_count is how many sign-ups have used it.
  int32 usage_count = 3;

  // created_at is the issue time, RFC 3339.
  string created_at = 4;

  // expires_at is the instant the token stops admitting sign-ups, RFC 3339.
  string expires_at = 5;

  // user_group_ids are the groups every account this token creates joins.
  repeated string user_group_ids = 6;
}

// CreateSignupTokenRequest carries the token's window, budget, and groups.
message CreateSignupTokenRequest {
  // ttl_seconds is how long the token admits sign-ups, in seconds: between
  // one hour and thirty days.
  int32 ttl_seconds = 1 [(buf.validate.field).int32 = {
    gte: 3600
    lte: 2592000
  }];

  // usage_limit is how many sign-ups the token admits. Unset means the
  // single invitation; when set it is between 1 and 1000.
  optional int32 usage_limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }];

  // user_group_ids are the groups every account signed up under this token
  // joins. Each names a group that exists; a token naming none creates
  // groupless accounts, the way upstream's empty list does.
  repeated string user_group_ids = 3 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

// CreateSignupTokenResponse is the issued token. raw_token is the only place
// the value exists: it is not stored and cannot be read back.
message CreateSignupTokenResponse {
  // token is the issued token's view.
  SignupToken token = 1;

  // raw_token is the value an invitation carries. Show it once.
  string raw_token = 2;

  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 3;

  // message is the human-readable sentence describing what the call did.
  string message = 4;
}

// ListSignupTokensRequest carries the page and the sort the caller asks for.
// Both page fields unset answer the first default-sized page.
message ListSignupTokensRequest {
  // page is the one-based page number.
  optional int32 page = 1;

  // limit is the page size.
  optional int32 limit = 2;

  // sort_by names the column the page orders by. Absent, the issue time
  // orders the page, newest first.
  optional string sort_by = 3 [(buf.validate.field).string = {
    in: [
      "created_at",
      "expires_at",
      "usage_count",
      "usage_limit"
    ]
  }];

  // sort_order flips the direction; absent means ascending.
  optional string sort_order = 4 [(buf.validate.field).string = {
    in: [
      "asc",
      "desc"
    ]
  }];
}

// ListSignupTokensResponse is the issued tokens and their pagination block.
message ListSignupTokensResponse {
  // tokens are the issued tokens, newest first.
  repeated SignupToken tokens = 1;

  // metadata is the pagination block the list responses carry.
  tango.common.v1.ListMetadata metadata = 2;

  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 3;

  // message is the human-readable sentence describing what the call did.
  string message = 4;
}

// DeleteSignupToken names the token to revoke.
message DeleteSignupTokenRequest {
  // id is the token row's identifier, the UUID string the list answered.
  string id = 1;
}

// DeleteSignupTokenResponse is empty: a successful deletion says so with the
// protocol, and a missed one with the not-found code.
message DeleteSignupTokenResponse {
  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 1;

  // message is the human-readable sentence describing what the call did.
  string message = 2;
}

// ListUsersRequest carries the page, the filter, and the sort the caller
// asks for.
message ListUsersRequest {
  // page is the one-based page number.
  optional int32 page = 1;

  // limit is the page size.
  optional int32 limit = 2;

  // search filters by a term matched against the username, the email, and
  // the display name. Absent means every account.
  optional string search = 3 [(buf.validate.field).string.max_len = 100];

  // sort_by names the column the page orders by. Absent, the creation time
  // orders the page, newest first.
  optional string sort_by = 4 [(buf.validate.field).string = {
    in: [
      "username",
      "email",
      "first_name",
      "last_name",
      "display_name",
      "created_at",
      "last_login_at"
    ]
  }];

  // sort_order flips the direction; absent means ascending.
  optional string sort_order = 5 [(buf.validate.field).string = {
    in: [
      "asc",
      "desc"
    ]
  }];
}

// ListUsersResponse is the page of accounts and their pagination block.
message ListUsersResponse {
  // users are the accounts, newest first.
  repeated User users = 1;

  // metadata is the pagination block the list responses carry.
  tango.common.v1.ListMetadata metadata = 2;

  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 3;

  // message is the human-readable sentence describing what the call did.
  string message = 4;
}

// GetUserRequest names the account to read.
message GetUserRequest {
  // id is the account's identifier in its wire form, a TypeID (`user_…`)
  // encoded from the row's UUID — the UUID never leaves the server.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetUserResponse is the account.
message GetUserResponse {
  // user is the account's view.
  User user = 1;

  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 2;

  // message is the human-readable sentence describing what the call did.
  string message = 3;
}

// CreateUserRequest carries the account fields and the optional credential.
message CreateUserRequest {
  // username is the account's handle: 3-32 characters of ASCII letters,
  // digits, and underscores, matched case-insensitively.
  string username = 1 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9_]{3,32}$"];

  // email is the account's address, matched exactly.
  string email = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"];

  // password is the account's primary credential, in clear text. It travels
  // only over TLS and is never logged. Absent means the account carries no
  // credential until one is set. The transport's floor keeps a degenerate
  // answer cheap; the strength rule itself is the service's.
  optional string password = 3 [(buf.validate.field).string.min_len = 8];

  // first_name is the given name.
  string first_name = 4 [
