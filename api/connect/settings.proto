// The database-backed application settings for product flows.
//
// Settings are declared in code — one catalog entry per item, carrying the
// key, the default value, and whether the value rests sealed and whether it
// is public — and the table stores the overrides. A caller reads the
// effective value: the override when one rests, the catalog default when
// not. Whether a value rests sealed is told by its enc: prefix alone; the
// reader opens it, and the wire never carries the sealed form. A public
// item is never sealed — the catalog declares the pair, and the constructor
// refuses a catalog that asks for it.
syntax = "proto3";

package tango.settings.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/riipandi/tango/codegen/proto/go/tango/settings/v1;settingsv1";

// SettingsService manages the deployment's database-backed settings. The
// administrative procedures carry the values in the clear to an
// administrator — the same trust the full configuration read gets; the
// record of a change never carries a value, because the value may be a
// secret.
service SettingsService {
  // List answers every setting: the catalog's items with their effective
  // values, the override resting and the default it falls back to.
  rpc List(ListRequest) returns (ListResponse);

  // Update replaces one setting's value. The key must be one the catalog
  // declares — a key that names nothing is a refusal, not a new item.
  rpc Update(UpdateRequest) returns (UpdateResponse);

  // Reset removes one setting's override, so the item answers its catalog
  // default again. An item already at its default answers unchanged.
  rpc Reset(ResetRequest) returns (ResetResponse);

  // ListPublic answers the settings an unauthenticated client may read:
  // the catalog items flagged public, their effective values. A public
  // item is never sealed, so this read never carries a ciphertext.
  rpc ListPublic(ListPublicRequest) returns (ListPublicResponse);
}

// ListRequest is empty: there is one settings table per deployment.
message ListRequest {}

// ListResponse carries every setting, ordered by key.
message ListResponse {
  // settings are the catalog's items with their effective values.
  repeated Setting settings = 1;
}

// UpdateRequest replaces one setting's value. The flags are not writable:
// the catalog owns them.
message UpdateRequest {
  // key is the setting's catalog key.
  string key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 350
  }];

  // value is the setting's value in the clear. A sealed item seals it
  // before it reaches the table; the value itself never travels further
  // than this request.
  string value = 2 [(buf.validate.field).string.max_len = 65536];
}

// UpdateResponse carries the item as it now rests.
message UpdateResponse {
  // setting is the item that was written, its value in the clear.
  Setting setting = 1;
}

// ResetRequest names one setting.
message ResetRequest {
  // key is the setting's catalog key.
  string key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 350
  }];
}

// ResetResponse carries the item after the reset: the value is the catalog
// default again.
message ResetResponse {
  // setting is the item that was reset.
  Setting setting = 1;
}

// ListPublicRequest is empty: the public set is the same for every caller.
message ListPublicRequest {}

// ListPublicResponse carries the settings an unauthenticated client may
// read, ordered by key.
message ListPublicResponse {
  // settings are the public items: names and values, no flags and no
  // instants, because a caller before sign-in needs the values alone.
  repeated PublicSetting settings = 1;
}

// PublicSetting is one public item: the name and the value, nothing else.
message PublicSetting {
  // key is the setting's catalog key.
  string key = 1;

  // value is the setting's value in the clear. A public item is never
  // sealed, so this is the stored value exactly.
  string value = 2;
}

// Setting is one item of the catalog with its effective value. A value that
// rests sealed behind the enc: prefix is carried here opened — the prefix
// is storage state, not a field of the item.
message Setting {
  // key is the setting's catalog key.
  string key = 1;

  // value is the item's effective value in the clear: the override when
  // one rests, the catalog default when not.
  string value = 2;

  // default_value is the value the item answers when no override rests —
  // and the value a reset restores.
  string default_value = 3;

  // sealed says whether the item's value rests encrypted in the table.
  bool sealed = 4;

  // public says whether the unauthenticated read publishes the item.
  bool public = 5;

  // updated_at is when the override last changed, absent while the item
  // answers its default.
  google.protobuf.Timestamp updated_at = 6;
}
