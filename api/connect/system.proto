// The contract for the surfaces the transport itself owns.
//
// The public health endpoints stay on HTTP (`/healthz` liveness and
// `/api/healthz` readiness); HealthService answers the same readiness result
// to a client that speaks ConnectRPC.
syntax = "proto3";

package tango.system.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/riipandi/tango/codegen/proto/go/tango/system/v1;systemv1";

// HealthService reports the availability of the dependencies the process runs
// on.
service HealthService {
  // Check answers the current readiness. A healthy system answers the result;
  // an unhealthy one fails with `unavailable`, and the error message names the
  // checks that are down.
  rpc Check(CheckRequest) returns (CheckResponse);
}

// CheckRequest is empty: the check set is fixed at startup, and the caller
// chooses nothing about it.
message CheckRequest {}

// CheckResponse is the readiness document. It carries the same facts the
// `/api/healthz` body publishes, so the two surfaces never disagree. Status
// travels as the connect code (`unavailable` on an unhealthy system) and the
// correlation id as a response header — the protocol, not the body.
message CheckResponse {
  // status is the aggregated availability, `healthy` or `unhealthy`.
  string status = 1;

  // details holds one entry per check, in check-name order.
  repeated CheckDetail details = 2;

  // took_ms is how long the whole check call took.
  double took_ms = 3;
}

// AppConfigService is the administrative surface over the deployment's
// application configuration. Pocket ID keeps the surface behind
// `/api/application-configuration`; Tango carries it as an RPC service here,
// and the public bootstrap read the SPA needs is still planned.
service AppConfigService {
  // Get answers the configuration the SPA reads before sign-in: the public
  // subset only. Every field is a fact a login screen may show — the mode,
  // the addresses the deployment answers at, and the toggles that decide
  // which sign-in options exist. Nothing deployment-private is in it.
  rpc Get(GetRequest) returns (GetResponse);

  // GetAll answers the deployment's configuration to an administrator. It
  // carries every setting the process runs on except the secrets: a secret
  // is never published, not even redacted, because the file or the
  // environment it was set from is the only place it can be read back.
  //
  // The configuration is resolved once at startup, so the answer describes
  // the running process, not the file on disk.
  rpc GetAll(GetAllRequest) returns (GetAllResponse);

  // TestEmail sends one templated test message through the configured
  // mailer. The send is synchronous: the response says the message left
  // this process, and an SMTP failure is the call's failure, so the
  // administrator learns whether the configuration works while the
  // settings screen is still open. An unconfigured mailer refuses the
  // procedure rather than pretending to have sent anything.
  //
  // The message goes to the caller's address on record unless the request
  // names one, so an administrator can prove the path to a mailbox they
  // hold without touching another account.
  rpc TestEmail(TestEmailRequest) returns (TestEmailResponse);
}

// GetRequest is empty: the public configuration is the same for every
// caller, and a caller who is not signed in has nothing to scope it with.
message GetRequest {}

// GetResponse carries the public configuration.
message GetResponse {
  // config is the subset the SPA bootstrap needs.
  AppConfigPublic config = 1;
}

// AppConfigPublic is the configuration an unauthenticated client may read.
// It is the public face of the deployment: the mode, the addresses, and the
// toggles that decide which sign-in options the login screen offers. The
// sections carry the names the full configuration uses, so a reader meets
// the same keys again in GetAll.
message AppConfigPublic {
  // app is the app section's public face.
  AppConfigPublicApp app = 1;

  // auth is the auth section's public face.
  AppConfigPublicAuth auth = 2;

  // mailer is the mailer section's public face.
  AppConfigPublicMailer mailer = 3;
}

// AppConfigPublicApp is the app section an unauthenticated client may read.
message AppConfigPublicApp {
  // mode is app.mode: development, staging, production, or test.
  string mode = 1;

  // base_url is app.base_url, the address the deployment is reached at.
  string base_url = 2;

  // assets_url is app.assets_url, where the SPA's static assets live. Empty
  // means the SPA serves its own.
  string assets_url = 3;
}

// AppConfigPublicAuth is the auth section's sign-in options.
message AppConfigPublicAuth {
  // one_time_access_email_as_admin_enabled is
  // auth.one_time_access_email_as_admin_enabled: an administrator may send
  // a one-time access link.
  bool one_time_access_email_as_admin_enabled = 1;

  // one_time_access_email_as_unauthenticated_enabled is
  // auth.one_time_access_email_as_unauthenticated_enabled: a visitor may
  // request a one-time access link.
  bool one_time_access_email_as_unauthenticated_enabled = 2;
}

// AppConfigPublicMailer is the mailer section's announcement switch.
message AppConfigPublicMailer {
  // announcement_email_enabled is
  // mailer.notifications.announcement_email_enabled: announcements reach
  // their audience by email as well as in the application.
  bool announcement_email_enabled = 1;
}

// GetAllRequest is empty: there is one configuration per process.
message GetAllRequest {}

// GetAllResponse carries the full configuration.
message GetAllResponse {
  // config is every non-secret setting the process runs on.
  AppConfig config = 1;
}

// AppConfig is the whole configuration, sectioned the way the JSON file is.
// Field names follow the configuration keys: a proto field and the key it
// comes from share the name, so a reader can go from one to the other.
// Every secret key — app.secret_key, the auth key material, the SMTP
// password, the S3 key secret, the collector headers, and the datastore
// URLs — is absent by construction, not blanked.
message AppConfig {
  // app is the app section, minus the secret key.
  AppConfigApp app = 1;

  // auth is the auth section, minus the signing key material.
  AppConfigAuth auth = 2;

  // cache is the cache section.
  AppConfigCache cache = 3;

  // database is the database section, minus the DSN.
  AppConfigDatabase database = 4;

  // fetcher is the fetcher section.
  AppConfigFetcher fetcher = 5;

  // kvstore is the kvstore section, minus the URL.
  AppConfigKVStore kvstore = 6;

  // log is the log section.
  AppConfigLog log = 7;

  // mailer is the mailer section, minus the SMTP password.
  AppConfigMailer mailer = 8;

  // otel is the otel section, minus the collector headers.
  AppConfigOTel otel = 9;

  // queue is the queue section.
  AppConfigQueue queue = 10;

  // rate_limit is the rate_limit section.
  AppConfigRateLimit rate_limit = 11;

  // server is the server section.
  AppConfigServer server = 12;

  // storage is the storage section, minus the S3 key secret.
  AppConfigStorage storage = 13;
}

// AppConfigApp is the app section.
message AppConfigApp {
  string mode = 1;
  string base_url = 2;
  string assets_url = 3;
  bool expose_reset_token = 4;
  bool expose_totp_secret = 5;
  int64 audit_retention_days = 6;
}

// AppConfigAuth is the auth section without the signing keys. The key
// material is published at /.well-known/jwks.json and read from the file or
// the environment that owns it, never from this surface.
message AppConfigAuth {
  string jwt_algorithm = 1;
  string issuer = 2;
  google.protobuf.Duration access_ttl = 3;
  google.protobuf.Duration refresh_short_ttl = 4;
  google.protobuf.Duration refresh_long_ttl = 5;
  bool expiry_email_enabled = 6;
  string session_driver = 7;
  bool one_time_access_email_as_admin_enabled = 8;
  bool one_time_access_email_as_unauthenticated_enabled = 9;
}

// AppConfigCache is the cache section.
message AppConfigCache {
  bool enable = 1;
  string driver = 2;
  google.protobuf.Duration ttl = 3;
  int64 max_memory = 4;
}

// AppConfigDatabase is the database section without the DSN.
message AppConfigDatabase {
  int64 max_conns = 1;
  int64 min_conns = 2;
  google.protobuf.Duration max_conn_lifetime = 3;
  google.protobuf.Duration max_conn_idle_time = 4;
  google.protobuf.Duration connect_timeout = 5;
  int64 connect_attempts = 6;
  google.protobuf.Duration connect_retry_interval = 7;
  string search_path = 8;
  string timezone = 9;
}

// AppConfigFetcher is the fetcher section.
message AppConfigFetcher {
  string user_agent = 1;
  google.protobuf.Duration timeout = 2;
  int64 retry_count = 3;
  google.protobuf.Duration retry_wait = 4;
  google.protobuf.Duration retry_max_wait = 5;
  int64 circuit_failure_threshold = 6;
  int64 circuit_success_threshold = 7;
  google.protobuf.Duration circuit_reset_timeout = 8;
  int64 max_body_bytes = 9;
}

// AppConfigKVStore is the kvstore section without the URL.
message AppConfigKVStore {
  bool enable = 1;
  int64 db = 2;
}

// AppConfigLog is the log section.
message AppConfigLog {
  string level = 1;
  repeated string transport = 2;
  string format = 3;
  AppConfigLogFile file = 4;
  AppConfigLogOTLP otlp = 5;
}

// AppConfigLogFile is the rotating file sink's settings.
message AppConfigLogFile {
  int64 max_size = 1;
  int64 max_backups = 2;
  int64 max_age = 3;
  bool compress = 4;
}

// AppConfigLogOTLP is the OTLP log sink's route on the collector.
message AppConfigLogOTLP {
  string path = 1;
  google.protobuf.Duration timeout = 2;
}

// AppConfigMailer is the mailer section without the SMTP password.
message AppConfigMailer {
  string from_email = 1;
  string from_name = 2;
  string smtp_host = 3;
  int64 smtp_port = 4;
  string smtp_username = 5;
  bool smtp_secure = 6;
  bool smtp_allow_plaintext_auth = 7;
  google.protobuf.Duration timeout = 8;
  AppConfigMailerNotifications notifications = 9;
}

// AppConfigMailerNotifications is the notification toggles the mailer serves.
message AppConfigMailerNotifications {
  bool new_device_notice_enabled = 1;
  bool password_changed_notice_enabled = 2;
  bool mfa_disabled_notice_enabled = 3;
  bool user_banned_notice_enabled = 4;
  bool user_unbanned_notice_enabled = 5;
  bool api_key_expiring_notice_enabled = 6;
  bool email_change_notice_enabled = 7;
  bool announcement_email_enabled = 8;
}

// AppConfigOTel is the otel section without the collector headers.
message AppConfigOTel {
  string endpoint = 1;
  string service_name = 2;
  string environment = 3;
  string protocol = 4;
  string compression = 5;
  AppConfigOTelQueue queue = 6;
  AppConfigOTelTracing tracing = 7;
  AppConfigOTelMetrics metrics = 8;
}

// AppConfigOTelQueue bounds each signal's export buffer.
message AppConfigOTelQueue {
  int64 max_size = 1;
}

// AppConfigOTelTracing is the trace export settings.
message AppConfigOTelTracing {
  bool enable = 1;
  string path = 2;
  string sampler = 3;
  double ratio = 4;
  google.protobuf.Duration batch_timeout = 5;
  google.protobuf.Duration export_timeout = 6;
  int64 max_batch_size = 7;
}

// AppConfigOTelMetrics is the metric export settings.
message AppConfigOTelMetrics {
  bool enable = 1;
  bool push = 2;
  string path = 3;
  string prometheus_path = 4;
  google.protobuf.Duration interval = 5;
  google.protobuf.Duration export_timeout = 6;
}

// AppConfigQueue is the queue section.
message AppConfigQueue {
  int64 num_workers = 1;
  google.protobuf.Duration release_after = 2;
  google.protobuf.Duration cleanup_interval = 3;
  bool encrypt = 4;
  string timezone = 5;
}

// AppConfigRateLimit is the rate_limit section.
message AppConfigRateLimit {
  string driver = 1;
  int64 limit = 2;
  google.protobuf.Duration window = 3;
}

// AppConfigServer is the server section.
message AppConfigServer {
  string host = 1;
  int64 port = 2;
  google.protobuf.Duration read_timeout = 3;
  google.protobuf.Duration write_timeout = 4;
  google.protobuf.Duration idle_timeout = 5;
  google.protobuf.Duration shutdown_timeout = 6;
  int64 max_request_bytes = 7;
  repeated string trusted_proxy_headers = 8;
  AppConfigCORS cors = 9;
}

// AppConfigCORS is the browser cross-origin policy.
message AppConfigCORS {
  repeated string allowed_origins = 1;
  repeated string allowed_methods = 2;
  repeated string allowed_headers = 3;
  repeated string exposed_headers = 4;
  bool allow_credentials = 5;
  google.protobuf.Duration max_age = 6;
}

// AppConfigStorage is the storage section without the S3 key secret.
message AppConfigStorage {
  string driver = 1;
  string local_path = 2;
  AppConfigStorageWatch watch = 3;
  AppConfigStorageS3 s3 = 4;
}

// AppConfigStorageWatch is the staging watcher's settings.
message AppConfigStorageWatch {
  bool enable = 1;
  google.protobuf.Duration debounce = 2;
}

// AppConfigStorageS3 is the object-storage settings without the key secret.
message AppConfigStorageS3 {
  string access_key_id = 1;
  string bucket_name = 2;
  string endpoint_url = 3;
  bool force_path_style = 4;
  string path_prefix = 5;
  string region = 6;
  google.protobuf.Duration signed_url_expires = 7;
}

// TestEmailRequest is empty unless the caller redirects the message.
message TestEmailRequest {
  // to is the address the message goes to when present. Empty means the
  // caller's own address on record.
  optional string to = 1 [(buf.validate.field).string.email = true];
}

// TestEmailResponse is empty: acceptance says the message was rendered and
// submitted, not that a mailbox accepted it.
message TestEmailResponse {
  // status is the outcome word the client checks — success; a
  // failure never reaches this body, it is a connect error.
  string status = 1;

  // message is the human-readable sentence describing what the call did.
  string message = 2;
}

// CheckDetail is the outcome of one dependency check.
message CheckDetail {
  // name identifies the dependency: a generic word such as `database` or
  // `storage`, never a product name and never an address.
  string name = 1;
  // status is the component's own availability: `up` or `down`.
  string status = 2;
  // target names what was inspected, and stays empty on a surface a caller
  // outside the machine reads.
  string target = 3;
  // error is the failure message, empty when the check passed.
  string error = 4;
  // optional marks a check that is reported without affecting the aggregate.
  bool optional = 5;
  // took_ms is how long this check took.
  double took_ms = 6;
}
