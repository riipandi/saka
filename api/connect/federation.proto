// ScimProviderService administers the outbound SCIM provisioning targets:
// one per OIDC client, each an external application that receives the
// client's visible accounts and groups over SCIM 2.0.
//
// Tango is the SCIM client here, not the server: the sync pushes the
// deployment's data out, so a provider row is a deployment decision —
// where to send, with which bearer token — and every procedure is
// administrative, like the client surface above.
service ScimProviderService {
  // GetByClient answers the provider one client syncs to. One provider per
  // client: the provider IS the client's outbound provisioning target.
  rpc GetByClient(GetScimProviderRequest) returns (GetScimProviderResponse);

  // Create attaches a provisioning target to a client. The token is shown
  // once in the response body the call returns; it is sealed at rest.
  rpc Create(CreateScimProviderRequest) returns (CreateScimProviderResponse);

  // Update replaces a provider's endpoint and token. The client it hangs
  // on is not replaceable — move the provider by deleting it and creating
  // one on the other client.
  rpc Update(UpdateScimProviderRequest) returns (UpdateScimProviderResponse);

  // Delete removes the provisioning target. The remote data the sync
  // pushed stays where it is; deleting the row only ends the sync.
  rpc Delete(DeleteScimProviderRequest) returns (DeleteScimProviderResponse);

  // Sync runs one provisioning pass now: the visible accounts and groups
  // are created, updated, and removed on the remote until it matches the
  // local snapshot. It reports the counts the pass produced.
  rpc Sync(SyncScimProviderRequest) returns (SyncScimProviderResponse);
}

// GetScimProviderRequest names the client whose provider is asked.
message GetScimProviderRequest {
  // client_id is the OIDC client the provider hangs on, its raw UUID form.
  string client_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// GetScimProviderResponse is the provider's view.
message GetScimProviderResponse {
  // provider is the provisioning target.
  ScimProvider provider = 1;

  // status is the outcome word the client checks — success; a failure
  // never reaches this body, it is a connect error.
  string status = 2;

  // message is the human-readable sentence describing what the call did.
  string message = 3;
}

// CreateScimProviderRequest names the target the client syncs to.
message CreateScimProviderRequest {
  // client_id is the OIDC client the provider hangs on, its raw UUID form.
  // A client with a provider already answers the failed-precondition code.
  string client_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];

  // endpoint is the SCIM base URL the sync calls, `https://…/scim/v2`.
  string endpoint = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
    pattern: "^https?://"
  }];

  // token is the bearer secret the sync presents. Empty means the target
  // answers unauthenticated, which some in-house targets do.
  string token = 3 [(buf.validate.field).string = {max_len: 1024}];
}

// CreateScimProviderResponse is the created provider's view, token included:
// the one read the operator gets before it is sealed for good.
message CreateScimProviderResponse {
  // provider is the created provisioning target.
  ScimProvider provider = 1;

  // status is the outcome word the client checks — success.
  string status = 2;

  // message is the human-readable sentence describing what the call did.
  string message = 3;
}

// UpdateScimProviderRequest replaces a provider's reachable facts.
message UpdateScimProviderRequest {
  // id is the provider's identifier, its raw UUID form.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];

  // endpoint is the SCIM base URL the sync calls.
  string endpoint = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
    pattern: "^https?://"
  }];

  // token is the bearer secret to re-seal. Empty keeps the stored one —
  // a rotation is a value the caller supplies, not an absence.
  string token = 3 [(buf.validate.field).string = {max_len: 1024}];
}

// UpdateScimProviderResponse is the updated provider's view.
message UpdateScimProviderResponse {
  // provider is the updated provisioning target.
  ScimProvider provider = 1;

  // status is the outcome word the client checks — success.
  string status = 2;

  // message is the human-readable sentence describing what the call did.
  string message = 3;
}

// DeleteScimProviderRequest names the provider to remove.
message DeleteScimProviderRequest {
  // id is the provider's identifier, its raw UUID form.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// DeleteScimProviderResponse is empty: a successful deletion says so with
// the protocol, and an unknown provider answers the not-found code.
message DeleteScimProviderResponse {
  // status is the outcome word the client checks — success.
  string status = 1;

  // message is the human-readable sentence describing what the call did.
  string message = 2;
}

// SyncScimProviderRequest names the provider to run one pass for.
message SyncScimProviderRequest {
  // id is the provider's identifier, its raw UUID form.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// SyncScimProviderResponse is the pass's outcome, the counts it produced.
message SyncScimProviderResponse {
  // users_created counts the accounts the remote did not have.
  int32 users_created = 1;

  // users_updated counts the accounts the remote had and changed.
  int32 users_updated = 2;

  // users_deleted counts the accounts removed from the remote.
  int32 users_deleted = 3;

  // groups_created counts the groups the remote did not have.
  int32 groups_created = 4;

  // groups_updated counts the groups the remote had and changed.
  int32 groups_updated = 5;

  // groups_deleted counts the groups removed from the remote.
  int32 groups_deleted = 6;

  // status is the outcome word the client checks — success.
  string status = 7;

  // message is the human-readable sentence describing what the call did.
  string message = 8;
}

// ScimProvider is one outbound provisioning target's view. The token never
// appears here after Create: it is sealed at rest and nothing reads it back.
message ScimProvider {
  // id is the provider's identifier, its raw UUID form.
  string id = 1;

  // client_id is the OIDC client the provider hangs on, its raw UUID form.
  string client_id = 2;

  // endpoint is the SCIM base URL the sync calls.
  string endpoint = 3;

  // token is the bearer secret, present only in the Create answer. Every
  // other read answers it empty.
  string token = 4;

  // last_synced_at is when a pass last completed, absent before the first.
  google.protobuf.Timestamp last_synced_at = 5;

  // created_at is when the provider row was made.
  google.protobuf.Timestamp created_at = 6;
}
