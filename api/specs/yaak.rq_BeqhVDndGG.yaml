bodyType: application/json
description: |-
  Replaces a client's logo. The bytes travel base64-encoded in the RPC body, at most 2 MiB; the kind is read off the magic bytes — a PNG, JPEG, or WebP only, an SVG refused, because the format is a script host. The raw image answers the logo endpoint.

  Saka procedure saka.federation.v1.OidcClientService/UploadLogo. Guard: admin.

  Parameters:
  - id (body, required): the client
  - logo (body, required): the image bytes, base64-encoded
