description: |-
  Finishes the enrollment: the browser's attestation JSON is verified against the stored challenge, the credential's counter and backup flags are recorded, and both enrollment ceilings (passkey.max_credentials, mfa.max_enrollments) are judged at this moment — lowering a limit never unregisters an existing device. A synced-passkey attestation is refused when webauthn.allow_synced_passkeys is off. An empty name falls back to the authenticator model.

  A failed verification costs the ceremony — start again.

  Guard: Session.
