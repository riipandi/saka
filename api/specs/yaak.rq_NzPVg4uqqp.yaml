bodyType: application/json
description: |-
  Send a one-time access code to one account's address. The code never passes through the caller: it travels by email alone. Refused while `auth.one_time_access_email_as_admin_enabled` is off.

  Mirror of Pocket ID `POST /api/users/{id}/one-time-access-email`, ported as the RPC procedure `tango.authn.v1.OneTimeAccessService/RequestEmailAsAdmin`.

  Body:
  - id: the account's identifier (uuid)
  - ttl_seconds: optional, 60..86400; unset means 900

  The `id`/`user_id` field is the account's wire TypeID (`user_...`), not the row's UUID - the UUID never leaves the server.
