bodyType: application/json
description: |-
  Replaces the set of groups the client's restriction names. The replace, not a delta: an empty list empties the roll — with the restriction on, the client admits nobody — and one identifier that names no group refuses the replacement whole.

  Saka procedure saka.federation.v1.OidcClientService/UpdateAllowedUserGroups. Guard: admin.

  Parameters:
  - id (body, required): the client
  - user_group_ids (body, required): the groups' wire identifiers (ugrp_...), replacing the set
