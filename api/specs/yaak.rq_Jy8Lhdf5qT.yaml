bodyType: application/json
description: |-
  Replaces the group's OIDC client allowlist — the group-side roll of which clients the group's members may be signed into, the mirror of the client surface's Update allowed user groups. The replace is whole: an empty list empties the roll, and one identifier that names no client refuses the replacement whole.

  Tango procedure tango.identity.v1.UserGroupService/SetAllowedOidcClients. Guard: admin.

  Parameters:
  - id (body, required): the group, in its wire form (ugrp_...)
  - oidc_client_ids (body, required): the client identifiers the roll names, replacing the set
