description: 'Replace a provider''s endpoint and token. An empty token keeps the stored one — a rotation is a value the caller supplies, not an absence. The client it hangs on is not replaceable.\n\nUpstream: Pocket ID''s PUT /api/scim/service-provider/{id}.\n\nParameters:\n- id (body, required): the provider''s identifier, raw UUID form\n- endpoint (body, required): SCIM base URL\n- token (body, optional): re-seal this value; empty keeps the stored token'
