description: |-
  Deletes the signed-in account's password credential — the self-service counterpart of Add password, for an account moving to passkey-only sign-in. The proof is the step-up token the guard consumes from the X-Tango-Reauthentication header (Reauthenticate by password, passkey, or the email code SendReauthenticationCode sent). The removal is refused while the account keeps no other live credential (passkey or binding) with failed_precondition; live sessions are ended and the account's address learns of the removal in a notification.

  Guard: Session + step-up.
