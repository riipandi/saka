description: |-
  End one of the account's sessions. Ending the current one is what Sign out does; ending another is how a holder closes a device they no longer hold. A session that is not the account's answers `not_found`; an already-ended one is the same success. Tango-only: upstream Pocket ID signs in with passkeys and carries no session lifecycle.

