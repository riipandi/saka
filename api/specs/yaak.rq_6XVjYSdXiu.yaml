description: |-
  List users with pagination, an optional search term, and sorting.

  Ported from Pocket ID `GET /api/users` as the `saka.identity.v1.UserService/ListUsers` procedure.

  Parameters:
  - page (body, optional): One-based page number
  - limit (body, optional): Page size
  - search (body, optional): Search term
  - sort_by (body, optional): One of username, email, first_name, last_name, display_name, created_at; absent orders newest first
  - sort_order (body, optional): SORT_ORDER_ASC or SORT_ORDER_DESC; absent means ascending
