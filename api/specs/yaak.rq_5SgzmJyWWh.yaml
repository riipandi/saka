body:
  text: |-
    {
      "identity": "${[ prompt.text(label='Identity', store='none', namespace='${[ctx.workspace()]}', ttl='0', placeholder='Email or username', defaultValue='${[ identity ]}') ]}",
      "password": "${[ prompt.text(label='Password', store='none', namespace='${[ctx.workspace()]}', ttl='0', defaultValue='${[ password ]}', placeholder='Password', password=true) ]}",
      "remember": ${[ remember ]}
    }
bodyType: application/json
description: 'Verifies the primary credential and issues the token pair — or, for an account keeping a confirmed TOTP authenticator, the MFA challenge: mfa_required=true with a short-lived mfa_pending_token (5 min) and no tokens. The caller finishes via [Saka] Complete MFA sign-in with the pending token plus a TOTP or recovery code. While the deployment''s `mfa.required` setting stands, an account holding no confirmed factor answers mfa_required=true with mfa_enrollment_required=true instead — the pending token admits the TOTP enrollment pair (its optional `pending_token` field), and the sign-in completes through the same Complete MFA sign-in after the confirm. A wrong identity and a wrong password answer the same failure, so the endpoint does not disclose which half was wrong.'
