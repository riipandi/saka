description: 'Verifies the primary credential and issues the token pair — or, for an account keeping a confirmed TOTP authenticator, the MFA challenge: mfa_required=true with a short-lived mfa_pending_token (5 min) and no tokens. The caller finishes via [Tango] Complete MFA sign-in with the pending token plus a TOTP or recovery code. A wrong identity and a wrong password answer the same failure, so the endpoint does not disclose which half was wrong.'
