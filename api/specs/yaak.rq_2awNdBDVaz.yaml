description: |-
  Lifts the named account's ban as a unit — start instant, expiry, and reason together — and queues a reinstatement notice to the account's address. An account that is not banned is the same success: the state the caller asked for is the state the row is in. An unknown or malformed identifier answers `not_found`.

  Saka-only surface, modeled on Better Auth's `unban-user` admin operation.
