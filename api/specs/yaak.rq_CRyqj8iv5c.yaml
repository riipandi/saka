description: |-
  Mints one more secret for a client. Several live secrets are legitimate — a rotation is an addition followed by a deletion, never a swap. Absent a value, a 32-character alphanumeric secret is drawn; a supplied one must carry at least 16 characters of the same alphabet. The raw value is shown exactly once.

  Tango procedure tango.federation.v1.OidcClientService/CreateSecret. Guard: admin.

  Parameters:
  - id (body, required): the client
  - secret (body, optional): the value to store, 16-128 alphanumeric characters
  - expires_at (body, optional): when the secret stops authenticating
