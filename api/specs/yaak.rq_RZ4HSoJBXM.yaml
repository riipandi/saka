      "totp_id": "${[ response.body.path(request='rq_TqXu366GwX', behavior='smart', ttl='0', result='first', join=', ', path='$.totp_id') ]}",
      "code": "${[ otp.generate(secret='${[ response.body.path(request=\'rq_TqXu366GwX\', behavior=\'smart\', ttl=\'0\', result=\'first\', join=\', \', path=\'$.secret\') ]}', inputFormat='Base32', type='totp', algorithm='SHA1', digits='6', period='30', window='1') ]}"
    }
bodyType: application/json
description: |-
  Activates the enrollment once the authenticator's current code verifies against its secret — the proof the account really holds the device the QR code was shown to.

  The account's **first** confirmation also writes its recovery set; the response carries the 10 recovery codes **in the clear exactly once** — their hashed rows are all that survive the call. Later enrollments answer no codes.

  Guard: the handler carries the rule the tables cannot express — a session caller runs on its own token, and a caller the `mfa.required` gate routed here presents the enrollment bridge in the optional `pending_token` field.

  A wrong code answers `unauthenticated` and the ceremony stays open until its expiry.
