bodyType: application/json
description: |-
  Replace the group's member set with the accounts the request names. An empty list empties the group.

  Ported from Pocket ID `PUT /api/user-groups/{id}/users` as the `saka.identity.v1.UserGroupService/SetUserGroupMembers` procedure.

  Parameters:
  - id (body, required): user group ID
  - user_ids (body, required): user IDs; every one must name an account

  The `id` field is the group's wire TypeID (`ugrp_...`), not the row's UUID - the UUID never leaves the server. Member ids stay the account's `user_` TypeID.
