description: |-
  Remove an account. The database trigger archives the removed row. An administrator cannot delete the account they are signed in with.

  Ported from Pocket ID `DELETE /api/users/{id}` as the `saka.identity.v1.UserService/DeleteUser` procedure.

  Parameters:
  - id (body, required): User ID

  The `id`/`user_id` field is the account's wire TypeID (`user_...`), not the row's UUID - the UUID never leaves the server.
