description: |-
  List every audit record, newest first, with the filters the administrative view offers: `event`, `user_id`, and `search` (matched against the account's username and email).

  Guard: Admin.

  Mirror of Pocket ID `GET /api/audit-logs/all`.

  The `user_id` field is the account's wire TypeID (`user_...`), not the row's UUID - the UUID never leaves the server. A record's `resource_id` is the resource's own UUID form (a session's, a group's), not the account's TypeID.
