bodyType: application/json
description: |-
  Replaces one of an account's claims — key and value together. A claim row the group surface owns is refused: the subject kind is the row's own, and a claim cannot silently move between subjects.

  Tango procedure tango.federation.v1.CustomClaimService/UpdateUserClaim. Guard: admin.

  Parameters:
  - id (body, required): the claim row's identifier, a TypeID (cclm_...)
  - key (body, required): the claim's new name
  - value (body, required): the claim's new value
