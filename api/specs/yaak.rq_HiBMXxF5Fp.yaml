bodyType: application/json
description: |-
  Creates or replaces one setting; the write is an upsert keyed by key.

  Tango procedure tango.settings.v1.SettingsService/Set. Guard: admin.

  sensitive seals the value before it reaches the table (AES-256-GCM, enc: prefix). A sealed setting cannot also be public - the pair is refused, and the table check constraint backs the refusal.

  Parameters:
  - key (body, required): the setting namespaced name
  - value (body, required): the value in the clear
  - sensitive (body): seal the value
  - public (body): publish to the unauthenticated read
