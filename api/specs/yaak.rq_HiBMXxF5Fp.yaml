description: |-
  Replaces one setting value. The write is an upsert over the catalog key; the flags (sealed, public) are the catalog, not the request.

  Saka procedure saka.settings.v1.SettingsService/Update. Guard: admin.

  A sealed item (per the catalog) encrypts the value at rest (AES-256-GCM, enc: prefix).

  Parameters:
  - key (body, required): the setting catalog key
  - value (body, required): the value in the clear
