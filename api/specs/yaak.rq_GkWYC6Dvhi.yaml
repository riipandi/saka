description: |-
  Removes one authenticator.

  An unconfirmed row needs no proof — deleting a mistyped start is how the ceremony is thrown away. A removal that leaves the account holding another confirmed factor is free. **The last confirmed factor's removal requires `code`** — a code from the factor itself or a recovery code — and the recovery set dies with the factor it answers for.

  Guard: Session.
