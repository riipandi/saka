description: |-
  Opens a resumable-upload session: the Upload-Metadata names the bucket and the object key, the Upload-Length declares the file's size, and the answer's Location carries the session's path while its Upload-Offset names how much the creation already carried (creation-with-upload - a request with a body stores the body as the first chunk). The bucket's existence and size limit are checked before any byte is accepted; a declared length past the bucket's file_size_limit answers 413.

  Saka-only: the tus protocol is implemented in-house over the storage engine; there is no upstream endpoint to port.
headers:
- enabled: true
  name: Upload-Length
  value: ${[ prompt.text(label='Upload Length', store='none', namespace='${[ctx.workspace()]}', ttl='0', defaultValue='', placeholder='1024') ]}
  id: null
- enabled: true
  name: Upload-Metadata
  value: bucket ${[ prompt.text(label='Bucket', store='none', namespace='${[ctx.workspace()]}', ttl='0', defaultValue='', placeholder='default') ] | b64enc}, key ${[ prompt.text(label='Key', store='none', namespace='${[ctx.workspace()]}', ttl='0', defaultValue='', placeholder='some/path/to/file.ext') ] | b64enc}, filetype ${[ prompt.text(label='Content Type', store='none', namespace='${[ctx.workspace()]}', ttl='0', defaultValue='', placeholder='application/octet-stream') ] | b64enc}
  id: null
method: POST
name: '[Saka] Upload (tus) - Create session'
