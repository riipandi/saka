bodyType: application/json
description: |-
  Defines a client and mints its first secret. The identifier is generated when absent — letters, digits, underscores, and hyphens only. The raw secret is shown exactly once; only its SHA-256 hash is stored. A public client forces the PKCE requirement on, and allowed_user_groups (the groups' wire identifiers) turns the group restriction on.

  Saka procedure saka.federation.v1.OidcClientService/CreateClient. Guard: admin.

  Parameters:
  - id (body, optional): the client_id the relying party will present
  - name (body, required): the display name a sign-in page shows
  - callback_urls (body, required): the redirect URIs, at least one
  - is_public (body, optional): a client that cannot keep a secret
  - allowed_user_groups (body, optional): groups the restriction admits
