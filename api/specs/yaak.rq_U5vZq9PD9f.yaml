bodyType: application/json
description: |-
  Issue a one-time access code for one account, for an administrator to hand over. The code exists in the response alone: only its hash is stored.

  Mirror of Pocket ID `POST /api/users/{id}/one-time-access-token`, ported as the RPC procedure `tango.authn.v1.OneTimeAccessService/CreateToken`.

  Body:
  - id: the account's identifier (uuid)
  - ttl_seconds: optional, 60..86400; unset means 900 (fifteen minutes, the short six-character form)

  The `id`/`user_id` field is the account's wire TypeID (`user_...`), not the row's UUID - the UUID never leaves the server.
