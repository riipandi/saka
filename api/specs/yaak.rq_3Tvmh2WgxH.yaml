description: |-
  Consume the pending change token and move the account to the address the token binds. The address moves with the account marked verified: the token proved control of the new address. Unknown, expired, and spent tokens answer the same failure, and the row is deleted, so the link works once. The success notice to the new address is gated by mailer.notifications.email_change_notice_enabled.

  Saka-only surface: the saka.identity.v1.EmailVerificationService/ConfirmEmailChange procedure. Guard: Public (the token is the credential).

  Parameters:
  - token (body, required): The raw change token from the confirm link
