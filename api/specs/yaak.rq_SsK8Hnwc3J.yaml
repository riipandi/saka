  text: |-
    {
      "id": "${[ userId ]}",
      "groupIds": ["REPLACE_UGRP_ID"]
    }
bodyType: application/json
description: |-
  Update the groups a specific user belongs to. The replacement is whole: `groupIds` names every group the account belongs to after the call, and an empty list removes it from all of them. Every identifier must name an existing group.

  Ported from Pocket ID `PUT /api/users/{id}/user-groups` as the `saka.identity.v1.UserGroupService/UpdateUserGroups` procedure. Administrative: the caller must name an administrator.

  Parameters:
  - id (path, required): User ID
