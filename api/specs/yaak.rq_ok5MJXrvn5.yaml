      "expiresAt": "2026-12-31T23:59:59Z"
    }
bodyType: application/json
description: |-
  Applies a ban to the named account: the start instant is now, the reason is required (it travels to the account in the notification and to the audit record), and `expiresAt` is optional — absent, the ban never lifts by itself. Every live session the account holds is ended in the same transaction, and a suspension notice is queued to the account's address.

  An unknown or malformed identifier answers `not_found`; an expiry in the past answers `invalid_argument`; an already-banned account is the same success, with the reason and expiry replaced and the live sessions ended again. An access token already issued keeps working until its own expiry — the statelessness the protocol settles — but the refresh token dies here.

  Saka-only surface, modeled on Better Auth's `ban-user` admin operation.
