description: |-
  Replaces a client's fields — the full replace, so a field the request leaves out falls back to empty. The secrets, the logo, and the group restriction are not fields of this call: each has its own procedure, because a rotation and an access change are happenings of their own.

  Tango procedure tango.federation.v1.OidcClientService/UpdateClient. Guard: admin.

  Parameters:
  - id (body, required): the client to rewrite
  - name (body, required): the display name
  - callback_urls (body, required): the redirect URIs, at least one
