description: |-
  List the caller's own audit records, newest first. Self-service: the account is the token's own subject, and a delegated (impersonated) caller is refused.

  Guard: Authenticated.

  Mirror of Pocket ID `GET /api/audit-logs`.

  The `user_id` field is the account's wire TypeID (`user_...`), not the row's UUID - the UUID never leaves the server. A record's `resource_id` is the resource's own UUID form (a session's, a group's), not the account's TypeID.
