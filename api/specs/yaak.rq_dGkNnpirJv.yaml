description: '[Tango] Spends a reset token from the reset email on a new password. The token is the whole credential — the caller carries none — and the new password must meet the account policy (min 8 chars, 3 of 4 classes, or a 16+ char passphrase). Success swaps the hash, revokes every live session, consumes the token, and sends the password-changed notice. Unknown, expired, and spent tokens answer permission_denied with one message.'
