description: |-
  Replace a group's two fields. Both are required.

  Ported from Pocket ID `PUT /api/user-groups/{id}` as the `saka.identity.v1.UserGroupService/UpdateUserGroup` procedure.

  Parameters:
  - id (body, required): user group ID
  - name (body, required): 2-255 characters, unique
  - display_name (body, required): 2-50 characters

  The `id` field is the group's wire TypeID (`ugrp_...`), not the row's UUID - the UUID never leaves the server. Member ids stay the account's `user_` TypeID.
