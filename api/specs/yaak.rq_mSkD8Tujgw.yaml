description: |-
  Ends a session without storing anything: the staging file and its manifest row go together. What a terminated session left answers not_found to every later HEAD or PATCH. A session the expiry reclaimed first answers the same not_found.

  Saka-only: the tus protocol is implemented in-house over the storage engine; there is no upstream endpoint to port.
