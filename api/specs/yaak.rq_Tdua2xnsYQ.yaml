description: |-
  Ends the delegated session the access token names and answers a fresh pair on the administrator's own account — leaving a delegation is signing back in to the caller's real identity.

  It is the one procedure an impersonated caller may call: the guard rule requires the delegation instead of refusing it, the way out of a borrowed identity must not be closed. The actor claims are checked against the session row's `impersonated_by` — a forged pair on a plain session answers `not_found`. A caller whose token carries no delegation answers `failed_precondition`. Both the ending and the new session are audited (`impersonation_stopped`, user_id naming the target so the started/stopped pair reads together).

  Saka-only surface.
