    }
bodyType: application/json
description: |-
  Spends the pending bridge `SignIn` minted on the password success plus the second factor — the authenticator's six-digit code, or one recovery code — on the full token pair. The answer is the same shape a one-factor sign-in gives, so a client entering the session treats the two alike.

  The bridge is server-side state with a hash: it dies at its success, at its expiry (5 minutes), or after **3 wrong codes** — whichever comes first, and a replayed code from the same time window refuses on the step guard. A wrong code or a dead bridge answers `unauthenticated` with no disclosure of which half was the lie.

  Guard: Public — the pending token is the credential.
