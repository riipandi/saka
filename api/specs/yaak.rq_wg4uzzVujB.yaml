bodyType: application/json
description: |-
  Update the currently authenticated user's information: the display surface, and the username while the change toggle admits it (absent keeps the current handle; a taken one answers already-exists). The email and the role are the administrative surface's (`UserService/UpdateUser`). Ported from Pocket ID `PUT /api/users/me` as the `saka.identity.v1.UserService/UpdateCurrentUser` procedure.

  Parameters:
  - username (body, optional): New handle; required shape enforced in the service
  - first_name (body, required): Given name
  - last_name (body, required): Family name
  - display_name (body, required): Display name
  - locale (body, optional): Locale tag

  The response's `avatar_url` is the account's picture's public URL, resolved from the filestore object the account references - empty (omitted on the wire) when the account has none, the picture the bundled default answers for.

