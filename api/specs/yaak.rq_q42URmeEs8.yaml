body:
  text: |-
    {
      "refresh_token": "${[ refreshToken ]}"
    }
bodyType: application/json
description: |-
  Exchange the refresh token for a fresh pair. The token is rotated in place — the row keeps its identifier, the secret and the window are replaced — so the session keeps its identity across renewals. A spent, ended, or expired token answers the same failure an unknown one does. Tango-only: upstream Pocket ID signs in with passkeys and carries no session lifecycle.

  Parameters:
  - refresh_token (body, required): the credential a sign-in or a renewal answered with
