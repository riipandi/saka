description: |-
  Withdraws one secret of a client. A client left with none can still authenticate nothing new, and its public-client grants are untouched. An unknown secret is the not-found refusal.

  Saka procedure saka.federation.v1.OidcClientService/DeleteSecret. Guard: admin.

  Parameters:
  - id (body, required): the client
  - secret_id (body, required): the secret within the client, from List client secrets
