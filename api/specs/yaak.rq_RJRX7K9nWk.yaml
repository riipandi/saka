description: |-
  RFC 7009 token revocation: any registered client may call it, the token must be its own — a token minted to another client answers 403 access_denied, an unknown token is a quiet 200. The revocation marks the presented tokens grant: the next refresh redemption answers invalid_grant and introspection answers active: false; an already-minted JWT access token keeps verifying until its own expiry.

  Endpoint: `POST /oidc/revoke`

  Mirror of Pocket ID `POST /api/oidc/revoke`.

  Parameters:
  - token (formData, required): The refresh or access token to revoke.
  - client_id (formData, required): The client the credential names.
  - client_secret (formData, required): The client credential.
