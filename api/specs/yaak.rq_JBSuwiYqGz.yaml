bodyType: application/json
description: |-
  Consume a one-time access code and sign its holder in. Anonymous by design: the code is the credential. The response is the token pair a password sign-in answers with.

  Mirror of Pocket ID `POST /api/one-time-access-token/{token}`, ported as the RPC procedure `tango.authn.v1.OneTimeAccessService/ExchangeToken`.

  Body:
  - token: the code the email linked to (6 or 12 characters)
  - device_token: optional; required when the code came from the public email request
