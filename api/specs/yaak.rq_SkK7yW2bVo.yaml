description: '[Tango] Stream the notifications created while the stream stays open, those that target the caller. Connect server-streaming: the client sends one POST with content-type application/connect+json and reads enveloped messages until it closes. A ping event keeps the connection through idle proxies; the stream carries no history, so a reconnecting client catches up with List Notifications. Authenticated: any caller.'
