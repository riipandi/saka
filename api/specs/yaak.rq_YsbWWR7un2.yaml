description: |-
  Remove a group. Membership rows die with it by the foreign keys' cascade; the accounts are untouched.

  Ported from Pocket ID `DELETE /api/user-groups/{id}` as the `saka.identity.v1.UserGroupService/DeleteUserGroup` procedure.

  Parameters:
  - id (body, required): user group ID

  The `id` field is the group's wire TypeID (`ugrp_...`), not the row's UUID - the UUID never leaves the server. Member ids stay the account's `user_` TypeID.
