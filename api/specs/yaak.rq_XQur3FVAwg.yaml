description: |-
  Create an account directly, without a signup token. The names are mandatory; the password is optional: an account created without one carries no credential until one is set.

  Ported from Pocket ID `POST /api/users` as the `saka.identity.v1.UserService/CreateUser` procedure.

  Parameters:
  - username (body, required): Account handle
  - email (body, required): Account address
  - first_name (body, required): Given name
  - last_name (body, required): Family name
  - password (body, optional): Primary credential
  - display_name (body, optional): Falls back to the composed names
