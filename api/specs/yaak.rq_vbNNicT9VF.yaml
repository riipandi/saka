description: |-
  Answers a client's logo as the raw image bytes — the asset the OIDC sign-in page fetches through an <img> tag, so the read is public and carries no envelope. A client without a logo, or an unknown one, answers 404, never a substitute. The cache holds briefly, because an update changes the bytes.

  Tango-only REST route beside the tango.federation.v1.OidcClientService surface. Guard: public.

  Parameters:
  - clientId (path): the client's identifier
headers: []
method: GET
name: '[Pocket ID] Get client logo'
sortPriority: 7000.0
url: ${[ apiBaseURL ]}/oidc/clients/:clientId/logo
