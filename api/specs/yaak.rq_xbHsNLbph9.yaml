bodyType: application/json
description: |-
  Removes one of an account's passkeys, aimed by the request's user_id.

  Pocket ID's mirror is `DELETE /api/users/{id}/webauthn-credentials/{credentialId}`; the surface is tango's `WebAuthnService`, the same door the holder's own delete uses — the stranding refusal (an account left with no way in) holds here too.

  Guard: Admin.
