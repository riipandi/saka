description: |-
  Opens a NEW session on the target account's behalf: the token pair names the target as its subject and the administrator in its actor claims (`actor_id`, `actor_username`), and the session row records the delegation in `impersonated_by`.

  The window is fixed at one hour — the refresh rotation keeps the delegation alive inside it, and the actor pair survives every renewal because it is re-signed from the session row. A target that is an administrator (or the caller itself) answers `permission_denied`; an unknown or malformed identifier answers `not_found`; a disabled or banned target answers the ended-session failure. The delegation is refused on self-service procedures by the guard, and both halves of its life are audited (`impersonation_started`, `impersonation_stopped`).

  Saka-only surface, modeled on Better Auth's admin plugin but fitted to this architecture. Call Stop impersonating to end the delegation and return to the administrator's own account.
