body:
  text: chunk bytes go here
bodyType: application/offset+octet-stream
description: |-
  Appends one chunk at the offset the request claims: the body rides application/offset+octet-stream and the Upload-Offset names the file's end the client believes. A claim the staging file's size does not match answers 409 - two writers raced, or the client lost its position - and the resume path is a HEAD followed by a correct PATCH. When the append reaches the declared length the completion fires inside the same request: the queue takes the file to its backend, and the answer's Upload-Offset is the whole size.

  Saka-only: the tus protocol is implemented in-house over the storage engine; there is no upstream endpoint to port.
