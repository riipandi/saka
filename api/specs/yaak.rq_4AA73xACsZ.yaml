description: |-
  Removes every authenticator and the recovery set — the way out when the account no longer wants the second factor.

  `code` is the second-factor proof, and it is the point of the procedure: **a stolen session alone cannot switch the protection off**, which is the property the whole second factor exists for.

  Guard: Session.
