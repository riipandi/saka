bodyType: application/json
description: |-
  Write the pending email change for the signed-in account and mail its token to the address the change moves to. The address must be free; the token binds it, so the confirmation moves the account to the address the request named. The message to the old address is gated by mailer.notifications.email_change_notice_enabled; the token message is transactional and always sent.

  Tango-only surface: the tango.identity.v1.EmailVerificationService/RequestEmailChange procedure. Guard: Authenticated (the claims name the account).

  Parameters:
  - new_email (body, required): The pending address
