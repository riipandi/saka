description: |-
  Create an account. The access mode decides the token: invite mode requires a valid signup token (chained from CreateSignupToken), open mode ignores it. The identity toggles decide whether username is required, and whether the account leaves with an email-verification code outstanding (sign-in refuses `failed_precondition` until the code confirms the address).

  Ported from Pocket ID `POST /api/signup` as the `tango.identity.v1.SignupService/Signup` procedure.

  Parameters:
  - username (body, optional): Account handle; required when auth.require_username is on
  - email (body, required): Account address
  - password (body, required): Primary credential
  - token (body, optional): Raw signup token; required only in the invite access mode
  - first_name (body, required): Given name
  - last_name (body, required): Family name
