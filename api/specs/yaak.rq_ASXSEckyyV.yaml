      "category": "announcement",
      "topic": "Maintenance",
      "title": "Scheduled maintenance this weekend",
      "body": "The service will be briefly unavailable on Sunday morning.",
      "audience_kind": "global",
      "send_email": true
    }
bodyType: application/json
description: '[Saka] Publish a notification to its audience. category is system or announcement; a system notice names its audience explicitly (users or user_groups, never global) and never carries a topic, an announcement defaults to the global audience and may carry a topic. user_ids and user_group_ids are UUID strings; the service refuses an audience that names an unknown account or group. send_email asks the email pass, gated by mailer.notifications.announcement_email_enabled. Administrative: requires the admin role.'
