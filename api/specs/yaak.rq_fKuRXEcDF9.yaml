description: |-
  Answers the offset a resuming client continues from: the Upload-Offset header is the staging file's size, the bytes the session already holds. A session nothing staged - expired, terminated, or never created - answers not_found. The client resumes by PATCHing at the offset this names, not by re-sending from zero.

  Saka-only: the tus protocol is implemented in-house over the storage engine; there is no upstream endpoint to port.
