description: |-
  Reset a specific user's profile picture to the default.

  Ported from Pocket ID `DELETE /api/users/{id}/profile-picture` as the
  `ResetProfilePicture` procedure. Requires a Bearer token of the account's
  owner or an administrator; the account falls back to the bundled default
  picture the read answers with.

  Parameters:
  - id (string, required): User ID

  The `id`/`user_id` field is the account's wire TypeID (`user_...`), not the row's UUID - the UUID never leaves the server.
