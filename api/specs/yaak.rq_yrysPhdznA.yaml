description: '[Saka] Spends one recovery code as a standalone proof of identity — the step-up a sensitive client flow asks for without a new sign-in. The code is consumed exactly once: it cannot verify twice, and it cannot open a session with afterwards. A wrong, spent, or unknown code answers unauthenticated with one message. Requires a Bearer session; a machine credential is refused by the guard.'
