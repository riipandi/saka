description: |-
  Forces a re-fetch of a CIMD client's metadata document, bypassing every cache — the operator's answer to a document that changed under it. Only a metadata-document client (client_type cimd, the id IS the document's URL) refreshes; a registered client is refused. The allowlist is judged again at the fetch.

  Tango procedure tango.federation.v1.OidcClientService/RefreshClient. Guard: admin.

  Parameters:
  - id (body, required): the CIMD client's identifier — the metadata document's URL
