description: |-
  Proves the caller again — by password or by a passkey assertion over a ceremony BeginLogin answered — and answers a single-use reauthentication token. The token is hashed at rest and dies at its five-minute window; the next guarded call spends it through the X-Tango-Reauthentication header, and its replay answers unauthenticated.

  The passkey form rides the oneof: {"passkey": {"session_id": "wcs_", "credential": "<assertion JSON>"}}.

  Guard: Session.
