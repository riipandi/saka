bodyType: application/json
description: |-
  Lifts the named account's open lockout — the automated restriction the failed-attempt policy writes when a sign-in run trips lockout.max_attempts. The lockout row is lifted and the account's failed-attempt streak starts fresh. An account with no open lockout is the same success. A ban is not a lockout and this procedure does not touch one — Unban user owns that. An unknown or malformed identifier answers `not_found`.

  Saka-only surface, the admin unlock Clerk pairs with its lockout.
