bodyType: application/json
description: |-
  Sets the signed-in account's first password credential — the self-service an account created without one holds. The proof is the step-up token the guard consumes from the X-Tango-Reauthentication header (Reauthenticate by password, passkey, or the email code SendReauthenticationCode sent); an account that already holds a password is refused with failed_precondition. The password must meet the account's policy — min length, the character rules, and the breach corpus; the strength floor is the frontend's to show.

  Guard: Session + step-up.
