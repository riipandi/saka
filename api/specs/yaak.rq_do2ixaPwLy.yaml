description: '[Tango] Removes every authenticator and the recovery set of a named account — the operator''s way in when the holder has lost every factor and cannot prove anything. The administrative session is the authority; no proof code exists to give. reason is optional and travels to the audit record and the notification. An account that holds no confirmed authenticator answers failed_precondition; an unknown or malformed identifier answers not_found. A notice email is queued to the account''s address.'
