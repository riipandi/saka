# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json

version: "2"

linters:
  default: none
  enable:
    - errcheck # Ensure errors are checked and handled
    - govet # Go's official vet tool for catching suspicious constructs
    - staticcheck # Advanced static analysis, catches bugs and code smells
    - ineffassign # Detects assignments to variables that are never used
    - unused # Finds unused variables, functions, and imports
    - gosec # Basic security checks (recommended to keep enabled)
  settings:
    errcheck:
      check-type-assertions: true
    staticcheck:
      checks:
        - "all" # Use all staticcheck checks for best coverage
    exhaustive:
      check:
        - switch
        - map
    exhaustruct:
      exclude:
        - ^net/http.Client$
        - ^net/http.Cookie$
        - ^net/http.Request$
        - ^net/http.Response$
        - ^net/http.Server$
        - ^net/http.Transport$
        - ^net/url.URL$
        - ^os/exec.Cmd$
        - ^reflect.StructField$
        - ^github.com/riipandi/saka/modules/.*$
        - ^github.com/riipandi/saka/pkg/.*$
        - ^github.com/aws/aws-sdk-go-v2/.*$
        - ^github.com/testcontainers/testcontainers-go.+Request$
        - ^github.com/testcontainers/testcontainers-go.FromDockerfile$
        - ^github.com/urfave/cli/v3.*$
        - ^gopkg.in/yaml.v3.Node$
        # - ^golang.org/x/tools/go/analysis.Analyzer$
        # - ^github.com/prometheus/client_golang/.+Opts$
        # - ^github.com/ClickHouse/clickhouse-go/v2.*$
    gosec:
      excludes:
        - G101
        - G102
        - G107
        # G203 (template.HTML) is the Vite integration's contract: the shell
        # embeds the fragment built from the build manifest and the dev
        # server URL — neither carries request input — through the one
        # trustedHead helper; every page-named value stays escaped.
        - G203
        # G401/G505 (sha1) are the Pwned Passwords range API's contract: the
        # k-anonymity query is the SHA-1 of the password, five hex characters
        # of it on the wire. The primitive is the protocol, not a chosen cipher.
        - G401
        - G505
    funlen:
      lines: 120
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    gomodguard:
      blocked:
        modules:
          - github.com/satori/go.uuid:
              recommendations:
                - github.com/google/uuid
              reason: satori's package is not maintained
          - github.com/gofrs/uuid:
              recommendations:
                - github.com/gofrs/uuid/v5
              reason: gofrs' package was not go module before v5
    govet:
      disable:
        # Disable struct field alignment warnings to allow easier
        # refactoring and avoid unnecessary churn in PRs.
        - fieldalignment
      enable-all: true
    inamedparam:
      skip-single-param: true
    lll:
      line-length: 120
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - gocognit
        - lll
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - godot
        source: (noinspection|TODO)
      - linters:
          - gocritic
        source: //noinspection
      - linters:
          - bodyclose
          - dupl
          - errcheck
          - exhaustruct
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
        path: _test\.go
      - linters:
          - gosec
        # G710 flags the two redirects the OAuth flow exists to make. The
        # start hands the browser to the provider's authorize URL, which
        # the operator's connection row — not the caller — names: the
        # request's provider segment only keys the row lookup, and the
        # redirect URI inside it is built from the row's own slug. The
        # callback hands the browser back to the SPA route under the
        # configured base URL, carrying a token the server minted at the
        # consume. No request value reaches a redirect target.
        path: modules/identity/oauthsso/handler\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - packages$
      - temp$

issues:
  max-same-issues: 50

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - packages$
      - build$
      - storage$
      - release$
      - temp$
