# yaml-language-server: $schema=https://json.schemastore.org/buf.json

# This file defines the configuration for buf.
# For detailed information, see https://buf.build/docs/configuration/v2/buf-yaml

version: v2

modules:
  - path: api/connect

# protovalidate's constraint options are the declarative validation the RPC
# surface enforces through connectrpc.com/validate; the well-known file comes
# from the Buf Schema Registry as a module dependency.
deps:
  - buf.build/bufbuild/protovalidate

# The contracts live flat in api/connect/*.proto: one folder, and a package
# per area rather than a directory per package. The directory rules below
# contradict that flat layout by design.
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_DIRECTORY
    - DIRECTORY_SAME_PACKAGE
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

breaking:
  use:
    - FILE
